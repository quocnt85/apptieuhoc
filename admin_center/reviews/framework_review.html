    <script>
        // Directly embedded from compiled markdown
        const docs = {
            universal_framework: "# 📁 KHUNG NĂNG LỰC CHUNG (UNIVERSAL COMPETENCY FRAMEWORK)\n## HỆ THỐNG PHÁT TRIỂN & ĐÁNH GIÁ NĂNG LỰC DÀNH CHO NOVASTARS LIFE SKILLS ADVENTURE\n\n---\n\n### PHÂN VAI CÁC CHUYÊN GIA BIÊN SOẠN\nTài liệu này được đồng thuận xây dựng bởi Hội đồng chuyên gia quốc tế của NovaStars:\n1. **Competency-Based Education (CBE) Specialist**: Định hình cấu trúc dạy học và đánh giá dựa trên năng lực thực tiễn.\n2. **OECD Education Expert**: Đồng bộ hóa khung năng lực với tiêu chuẩn toàn cầu OECD Learning Compass 2030.\n3. **CASEL Social Emotional Learning Expert**: Tích hợp 5 nhóm năng lực cảm xúc - xã hội (SEL) cốt lõi.\n4. **UNESCO Life Skills Expert**: Đảm bảo các kỹ năng sinh tồn, kỹ năng sống và tư duy thế kỷ 21 được phản ánh rõ nét.\n5. **Cambridge Curriculum Designer**: Thiết kế cấu trúc phân cấp (Taxonomy) khoa học, chặt chẽ, dễ mở rộng.\n6. **Primary Education Specialist**: Tinh chỉnh nội dung phù hợp với đặc thù tâm sinh lý học sinh tiểu học (6 - 11 tuổi).\n7. **Child Development Psychologist**: Đảm bảo các nhiệm vụ và hình thức đánh giá an toàn, tích cực, không gây áp lực.\n8. **Learning Scientist**: Ứng dụng các lý thuyết về Mastery Learning và Experiential Learning vào vòng lặp học tập.\n9. **Assessment Specialist**: Thiết kế hệ thống đánh giá đa chiều (Formative/Summative, Diagnostic, Authentic Assessment).\n10. **Product Architect**: Thiết kế cấu trúc dữ liệu và logic vận hành hệ thống, tối ưu hóa sự phối hợp giữa Game, AI và Analytics.\n\n---\n\n## 1. TRIẾT LÝ THIẾT KẾ (DESIGN PHILOSOPHY)\n\n### Purpose\nXác lập hệ quy chiếu tư tưởng và các nguyên lý sư phạm nền tảng để định hướng cho việc sản xuất nội dung, phát triển game, huấn luyện AI, và thiết kế hệ thống báo cáo cho phụ huynh.\n\n### Design Rationale\nChúng tôi chuyển dịch hoàn toàn từ mô hình giáo dục truyền thống dựa trên kiến thức sang mô hình **Phát triển Năng lực Thực hành (Competency-Based Education)**. Đối với học sinh tiểu học, việc học kỹ năng sống không thể đạt hiệu quả nếu chỉ dừng lại ở việc đọc sách hoặc làm bài kiểm tra trắc nghiệm lý thuyết. Trẻ cần được nhúng vào một bối cảnh có ý nghĩa (Story-based), thực hành trong môi trường giả lập an toàn (Play-based), ứng dụng trực tiếp ngoài đời thực (Learning by Doing), nhận phản hồi đồng hành từ AI (Adaptive Learning), và nhận được sự công nhận từ gia đình (Social Emotional Learning & Positive Psychology).\n\n```\n   [ Cốt truyện hấp dẫn ] (Kích thích tò mò)\n            │\n            ▼\n   [ Game giả lập an toàn ] (Rèn luyện quyết định)\n            │\n            ▼\n [ Nhiệm vụ thực tế & Phản tư ] (Chuyển đổi hành vi)\n            │\n            ▼\n   [ Phụ huynh xác thực ] (Thiết lập thói quen)\n```\n\n### Educational Basis\n* **OECD Learning Compass 2030**: Nhấn mạnh vai trò của tính chủ động (Student Agency), thông qua vòng lặp Phản tư - Dự đoán - Hành động (Anticipation-Action-Reflection cycle).\n* **Mastery Learning (Benjamin Bloom)**: Học sinh phải làm chủ được kỹ năng ở cấp độ hiện tại trước khi chuyển sang kỹ năng phức tạp hơn.\n* **Experiential Learning (David Kolb)**: Học tập là một chu kỳ liên tục đi từ Trải nghiệm cụ thể -> Quan sát phản tư -> Khái niệm hóa -> Thử nghiệm tích cực.\n* **Positive Psychology (Martin Seligman - Khung PERMA)**: Xây dựng sự tự tin của trẻ thông qua việc công nhận những tiến bộ nhỏ, tránh trừng phạt, tập trung vào điểm mạnh và cảm xúc tích cực.\n\n### Trade-offs\n* **Sự đánh đổi**: Thời gian để học sinh hoàn thành một kỹ năng sẽ dài hơn nhiều so với việc chỉ học lý thuyết suông. Chi phí sản xuất nội dung (bao gồm game, kịch bản hội thoại AI, nhiệm vụ đời thực) và chi phí vận hành hệ thống xác thực từ phụ huynh sẽ cao hơn đáng kể so với mô hình LMS truyền thống.\n* **Quyết định**: Chấp nhận giảm số lượng kỹ năng học được trong một tháng để tập trung sâu vào chất lượng chuyển đổi hành vi thực tế của trẻ.\n\n### Advantages\n* Trẻ thực sự hình thành năng lực tự lập, an toàn và giao tiếp xã hội ngoài đời, mang lại giá trị thực chất cho gia đình và nhà trường.\n* Tăng tỷ lệ giữ chân người dùng (Retention) nhờ cơ chế game nhập vai cuốn hút và sự tham gia tự nhiên của phụ huynh.\n* Dữ liệu tiến bộ của trẻ là dữ liệu hành vi thực chất, không phải dữ liệu học thuộc lòng.\n\n### Risks\n* Phụ huynh bận rộn không tham gia xác thực nhiệm vụ của trẻ, dẫn đến tắc nghẽn trong tiến trình Mastery của học sinh.\n* AI Companion đánh giá câu trả lời phản tư không chính xác hoặc đưa ra gợi ý nhiệm vụ không an toàn.\n* *Biện pháp giảm thiểu*: Tích hợp hệ thống nhắc nhở tự động, thiết kế nhiệm vụ đời thực siêu nhỏ (Micro-Missions) dễ thực hiện trong 2-3 phút, và cài đặt bộ lọc an toàn vật lý nghiêm ngặt cho AI.\n\n### Dependencies\n* Hệ thống Game Client (Unity/Flutter) cần đồng bộ trạng thái học tập theo thời gian thực với dynamic database (Firestore).\n* Module AI Companion cần được huấn luyện dựa trên thư viện prompt chuẩn hóa về an toàn trẻ em.\n\n### Future Impact\nLàm nền tảng vững chắc để mở rộng chương trình học lên cấp THCS & THPT. Hệ thống dữ liệu năng lực (Competency Portfolio) của học sinh có thể tích hợp với học bạ số quốc tế hoặc hồ sơ ngoại khóa của học sinh trong tương lai.\n\n---\n\n## 2. ĐỊNH NGHĨA NĂNG LỰC & MỐI QUAN HỆ (COMPETENCY DEFINITIONS)\n\n### Purpose\nChuẩn hóa thuật ngữ kỹ thuật và mô hình hóa mối liên kết hữu cơ giữa các thành phần cấu thành năng lực trong hệ thống NovaStars.\n\n### Design Rationale\nChúng tôi từ chối các định nghĩa mơ hồ về \"năng lực\". Đối với một hệ thống EdTech vận hành bằng AI và Game, mọi thành phần thuộc năng lực của học sinh phải được định nghĩa dưới dạng các thực thể có thể quan sát, đo lường và lập trình được. Năng lực không phải là một khối tĩnh, mà là kết quả của sự tích hợp các yếu tố kiến thức, kỹ năng, thái độ, được chuyển hóa thành thói quen thông qua các hành vi lặp đi lặp lại ngoài đời thực.\n\n```\n       [ Mindset & Value ] (Ý chí, Thái độ)\n               │\n               ▼\n[ Knowledge ] ───► [ Skill ] ───► [ Behavior ] ───► [ Habit ]\n                                       │\n                                       ▼\n                              [ Performance & Evidence ]\n                                       │\n                                       ▼\n                                  [ Mastery ]\n```\n\n### Educational Basis\n* **Khung năng lực UNESCO thế kỷ 21**: Định nghĩa năng lực bao gồm kiến thức (learning to know), kỹ năng (learning to do), thái độ (learning to be) và chung sống (learning to live together).\n* **Thuyết thay đổi hành vi (Behavior Change Wheel - Michie et al.)**: Hành vi chịu sự chi phối của Năng lực (Capability), Cơ hội (Opportunity) và Động lực (Motivation).\n\n### Định nghĩa các thành phần:\n1. **Knowledge (Kiến thức)**: Tập hợp các thông tin, khái niệm, nguyên tắc mà trẻ ghi nhớ và thấu hiểu (ví dụ: biết rằng nước là chất dẫn điện).\n2. **Skill (Kỹ năng)**: Khả năng áp dụng kiến thức để thực hiện một công việc hoặc giải quyết một vấn đề trong bối cảnh cụ thể (ví dụ: biết cách rút phích cắm điện an toàn).\n3. **Behavior (Hành vi)**: Các hành động cụ thể của trẻ có thể quan sát trực tiếp được trong thế giới thực (ví dụ: không dùng tay ướt để chạm vào thiết bị điện).\n4. **Mindset (Tư duy)**: Cách trẻ nhìn nhận bản thân và thế giới, định hình thái độ đối với việc học tập và đối mặt với thử thách (ví dụ: tư duy phát triển - Growth Mindset, luôn tin rằng mình có thể cẩn thận hơn).\n5. **Value (Giá trị)**: Niềm tin cốt lõi dẫn dắt các lựa chọn mang tính đạo đức và xã hội của trẻ (ví dụ: sự tôn trọng, lòng trắc ẩn, tính trung thực).\n6. **Habit (Thói quen)**: Các hành vi tích cực được thực hiện một cách tự động, lặp đi lặp lại trong đời sống hàng ngày mà không cần sự nhắc nhở liên tục.\n7. **Performance (Thể hiện thực tế)**: Kết quả đầu ra của hành vi khi trẻ thực hiện một nhiệm vụ trong một bối cảnh cụ thể dưới sự đánh giá của người giám sát.\n8. **Evidence (Bằng chứng)**: Các tạo tác vật lý hoặc số hóa (hình ảnh, video, ghi âm phản tư, nhật ký phụ huynh) minh chứng cho hành vi thực tế của trẻ.\n9. **Mastery (Sự thành thạo)**: Trạng thái học sinh tự tin, thực hiện thành thạo hành vi đạt chuẩn một cách nhất quán trong nhiều bối cảnh thực tế khác nhau.\n10. **Competency (Năng lực)**: Sự tích hợp hài hòa giữa *Knowledge*, *Skill*, *Behavior*, *Mindset* và *Value* để giải quyết hiệu quả các thách thức phức tạp trong đời sống thực tế.\n\n### Trade-offs\n* **Sự đánh đổi**: Việc đo lường đầy đủ 10 thành phần này phức tạp hơn rất nhiều so với kiểm tra trắc nghiệm lý thuyết. Việc thu thập bằng chứng (Evidence) đòi hỏi sự hợp tác từ gia đình.\n* **Quyết định**: Tập trung đánh giá *Knowledge* & *Skill* trên ứng dụng thông qua game và thử thách; đánh giá *Behavior*, *Habit* và *Mastery* ở thế giới thực thông qua xác thực của phụ huynh và bằng chứng đa phương tiện.\n\n### Advantages\n* Tạo ra sự thống nhất ngôn ngữ giữa các bộ phận Sư phạm, Game, AI và Phụ huynh.\n* Đảm bảo hệ thống AI Companion không đánh giá mơ hồ, mà bám sát vào các bằng chứng hành vi cụ thể (Evidence-based evaluation).\n\n### Risks\n* Học sinh có thể đối phó để tạo ra bằng chứng giả.\n* *Biện pháp giảm thiểu*: Thiết kế các nhiệm vụ đời thực có tính tương tác cao với phụ huynh, AI quét trùng lặp hình ảnh/giọng nói để phát hiện gian lận.\n\n### Dependencies\n* Định nghĩa này phải được ánh xạ chính xác vào Lược đồ Cơ sở Dữ liệu (Database Schema).\n\n### Future Impact\nTạo tiền đề cho việc xây dựng học bạ số năng lực cá nhân hóa (Personalized Competency Portfolio) được các tổ chức giáo dục quốc tế công nhận.\n\n---\n\n## 3. CẤU TRÚC NĂNG LỰC ĐA TẦNG (COMPETENCY STRUCTURE)\n\n### Purpose\nThiết lập cây phân cấp dữ liệu học tập (Curriculum Taxonomy Tree) từ cấp vĩ mô (Domain) xuống vi mô (Activity, Assessment), giúp tối ưu hóa việc quản lý nội dung và cá nhân hóa lộ trình học tập của AI.\n\n### Design Rationale\nChúng tôi thiết kế cấu trúc 8 tầng từ trên xuống dưới để đảm bảo tính modular. Mọi hoạt động của học sinh trong game phải liên kết trực tiếp với một mục tiêu học tập cụ thể, mục tiêu đó bổ trợ cho một kỹ năng vi mô, kỹ năng vi mô đó cấu thành kỹ năng lớn, thuộc một nhóm năng lực cốt lõi. Cấu trúc này cho phép hệ thống phân tích chính xác lỗ hổng năng lực của học sinh (ví dụ: trẻ yếu kỹ năng \"Rút phích cắm\" chứ không phải yếu toàn bộ nhóm \"An toàn điện\").\n\n```\nDomain (Lĩnh vực lớn)\n  └── Cluster (Nhóm năng lực)\n        └── Skill (Kỹ năng cốt lõi)\n              └── Micro-skill (Kỹ năng vi mô)\n                    └── Learning Objective (Mục tiêu học tập)\n                          └── Activity (Hoạt động học/chơi)\n                                └── Assessment (Công cụ đánh giá)\n                                      └── Evidence (Bằng chứng thực tế)\n```\n\n### Educational Basis\n* **Phân loại mục tiêu giáo dục Bloom cải tiến (Anderson & Krathwohl)**: Tổ chức từ nhận thức cơ bản đến sáng tạo và phản tư sâu.\n* **Kiến trúc hệ thống dữ liệu giáo dục (CEDS - Common Education Data Standards)**: Đảm bảo tương thích dữ liệu giáo dục chuẩn quốc tế.\n\n### Chi tiết cấu trúc 8 tầng:\n1. **Competency Domain (Lĩnh vực năng lực)**: Các mảng lớn nhất trong cuộc sống của trẻ (ví dụ: *Self-Management - Tự quản bản thân*).\n2. **Competency Cluster (Nhóm năng lực)**: Các nhóm kỹ năng nhỏ hơn có chung mục đích phát triển (ví dụ: *Physical Safety - An toàn thể chất*).\n3. **Skill (Kỹ năng cốt lõi)**: Đơn vị kỹ năng hoàn chỉnh có thể độc lập giảng dạy (ví dụ: *Fire Safety - An toàn phòng cháy chữa cháy*).\n4. **Micro-skill (Kỹ năng vi mô)**: Các thao tác, hành động nhỏ cấu thành kỹ năng cốt lõi (ví dụ: *Bò sát mặt đất khi có khói độc*).\n5. **Learning Objective (Mục tiêu học tập)**: Phát biểu cụ thể về những gì trẻ biết, hiểu hoặc làm được sau khi hoàn thành một hoạt động (ví dụ: \"Học sinh giải thích được tại sao khói độc bay phía trên và tại sao cần che khăn ẩm\").\n6. **Activity (Hoạt động học/chơi)**: Đơn vị trải nghiệm trong game (Story, Mini-game, Boss Battle) hoặc ngoài đời thực (Real-life Mission) để đạt mục tiêu học tập.\n7. **Assessment (Công cụ đánh giá)**: Câu hỏi tình huống, thử thách hoặc nhiệm vụ được dùng để kiểm tra việc đạt mục tiêu (ví dụ: Câu hỏi chọn cách di chuyển đúng trong phòng đầy khói).\n8. **Evidence (Bằng chứng)**: Tạo tác số được lưu lại từ hoạt động đánh giá thực tế (ví dụ: Đoạn ghi âm học sinh giải thích quy tắc thoát hiểm cho AI Companion).\n\n### Trade-offs\n* **Sự đánh đổi**: Cấu trúc quá nhiều tầng làm tăng độ phức tạp khi thiết kế cơ sở dữ liệu và yêu cầu biên soạn nội dung cực kỳ tỉ mỉ.\n* **Quyết định**: Áp dụng bắt buộc cấu trúc này cho tất cả 34 kỹ năng cốt lõi để đảm bảo AI có thể phân tích dữ liệu ở mức độ chi tiết cao (Granular Analytics).\n\n### Advantages\n* Hỗ trợ AI Companion thực hiện lập lộ trình thích ứng (Adaptive Learning Paths) cực kỳ chuẩn xác.\n* Đội ngũ sản xuất nội dung có bộ khung (SOP) rõ ràng để biên soạn tài liệu, không bị trùng lặp hoặc sót kiến thức.\n\n### Risks\n* Nguy cơ gãy cấu trúc nếu định nghĩa mục tiêu học tập quá rộng hoặc quá hẹp.\n* *Biện pháp giảm thiểu*: Thiết lập quy trình kiểm duyệt nội dung (Review Gate) nghiêm ngặt trước khi nhập liệu vào CMS.\n\n### Dependencies\n* Phải đồng bộ hóa cấu trúc này với cấu trúc thư mục của dự án và lược đồ cơ sở dữ liệu Firestore.\n\n### Future Impact\nHệ thống có thể dễ dàng bổ sung thêm các Domain hoặc Skill mới mà không cần thiết kế lại cấu trúc cốt lõi của database.\n\n---\n\n## 4. HỆ THỐNG MỨC ĐỘ THÀNH THẠO (COMPETENCY LEVELS)\n\n### Purpose\nĐo lường và biểu diễn trực quan hóa quá trình tiến bộ của học sinh từ khi chưa biết đến khi làm chủ hoàn toàn một kỹ năng.\n\n### Design Rationale\nChúng tôi không sử dụng thang điểm 10 truyền thống vì nó tạo áp lực thi cử và không phản ánh chính xác năng lực thực tế. Thay vào đó, chúng tôi thiết kế hệ thống **5 mức độ thành thạo cải tiến (Levels 0 - 4)**, liên kết trực tiếp với **Khung đánh giá đa tầng LSCAF (Tiers A-E)** và có chỉ số hành vi cụ thể cho từng lớp tiểu học.\n\n| Cấp độ | Tên mức độ | Trạng thái năng lực của trẻ | Tương ứng với LSCAF |\n| :--- | :--- | :--- | :--- |\n| **Level 0** | **Unknown (Chưa tiếp cận)** | Chưa từng tiếp cận hoặc chưa có dữ liệu đánh giá đầu vào. | Chưa có dữ liệu |\n| **Level 1** | **Aware (Nhận thức)** | Đã biết khái niệm cơ bản, hiểu lý do và nhận diện được đúng/sai trong lý thuyết. | Tier A (Knowledge) & Tier B (Understanding) |\n| **Level 2** | **Practice (Thử nghiệm)** | Có thể đưa ra quyết định tối ưu trong các tình huống mô phỏng của game. | Tier C (Decision Making) |\n| **Level 3** | **Competent (Năng lực nhận thức)** | Có khả năng phân tích, phê phán hành vi của người khác và tự phản tư về bản thân. | Tier D (Judgment) & Tier E (Reflection) |\n| **Level 4** | **Mastery (Thành thạo thực tế)** | Thực hiện thành công nhiệm vụ thực tế ngoài đời thực và được phụ huynh xác thực hành vi. | Parent Verified Mission & Evidence |\n\n### Educational Basis\n* **Thang phân loại nhận thức Dreyfus**: Mô tả 5 giai đoạn phát triển năng lực: Novice (Mới bắt đầu) -> Advanced Beginner (Tập sự) -> Competent (Có năng lực) -> Proficient (Thành thạo) -> Expert (Chuyên gia).\n* **Vygotsky - Vùng phát triển gần nhất (ZPD)**: Thiết kế hỗ trợ (scaffolding) để đẩy trẻ từ Level 1 lên Level 4 một cách tự nhiên.\n\n### Trade-offs\n* **Sự đánh đổi**: Mức độ Level 4 phụ thuộc hoàn toàn vào hành động của trẻ ngoài đời thực và xác thực từ cha mẹ. Điều này có thể làm giảm tỷ lệ học sinh đạt Level 4 trên ứng dụng nếu cha mẹ không hợp tác.\n* **Quyết định**: Tách biệt rõ ràng phần thưởng trong game: đạt Level 3 học sinh đã có thể hoàn thành cốt truyện chính, nhưng đạt Level 4 mới nhận được Huy hiệu Vàng Danh dự và ghi nhận vào \"Học bạ năng lực thực tế\".\n\n### Advantages\n* Phản ánh trung thực năng lực của trẻ: Một đứa trẻ đạt điểm 10 trắc nghiệm nhưng không biết sơ cứu bỏng ngoài đời chỉ ở Level 3 (nhận thức), không được công nhận Level 4 (Mastery).\n* Động viên trẻ hành động thực tế để đạt danh hiệu cao nhất.\n\n### Risks\n* Trẻ cảm thấy nản lòng nếu bị kẹt ở Level 3 quá lâu do phụ huynh bận rộn.\n* *Biện pháp giảm thiểu*: Thiết kế các nhiệm vụ tự xác thực bởi AI Companion (ví dụ: trẻ ghi âm giải thích, chụp hình sản phẩm tự làm để AI quét sơ bộ) để tạm thời mở khóa tiến trình trước khi đợi phụ huynh phê duyệt chính thức.\n\n### Dependencies\n* Module đánh giá của AI Companion và Dashboard của Phụ huynh phải đồng bộ chung thang đo này.\n\n### Future Impact\nHệ thống này cho phép so sánh sự phát triển năng lực của học sinh trên toàn hệ thống thông qua các đường cong tăng trưởng (Growth Curves).\n\n---\n\n## 5. LỘ TRÌNH TIẾN BỘ NĂNG LỰC (COMPETENCY PROGRESSION)\n\n### Purpose\nĐịnh hình dòng trải nghiệm học tập (Learning Journey Flow) để dẫn dắt trẻ từ tò mò ban đầu đến thói quen bền vững ngoài đời thực.\n\n### Design Rationale\nChúng tôi xây dựng lộ trình tiến bộ theo mô hình vòng lặp 8 bước tuần tự bám sát hoàn toàn đặc tả của Game Design Bible nhằm bảo đảm học sinh không bị ngợp thông tin. Trải nghiệm bắt đầu bằng cảm xúc và câu chuyện tương tác, dẫn dắt qua mini-games và thử thách tình huống, kiểm tra giới hạn nhận thức qua trận đấu Boss, đào sâu tư duy qua phản tư với AI Companion, chuyển dịch ra đời thực qua nhiệm vụ thực tế và cuối cùng là xác nhận từ phụ huynh để mở khóa Mastery.\n\n```\n[1. Interactive Story] ──► [2. Practice Mini-Games] ──► [3. Scenario Challenge]\n                                                             │\n                                                             ▼\n[6. Real-life Mission] ◄── [5. AI Reflection] ◄── [4. Boss Battle]\n       │\n       ▼\n[7. Parent Verification] ──► [8. Competency Mastered]\n```\n\n### Chi tiết 8 bước của Lộ trình:\n1. **Interactive Story (Cốt truyện tương tác)**: Trẻ nhập vai đọc một chương truyện ngắn (2-3 phút) về nhân vật Su và Kem gặp phải tình huống thực tế nguy hiểm hoặc cần giải quyết (đạt nhận thức Tier A).\n2. **Practice Mini-Games (Mini-game luyện tập)**: Trẻ tham gia các mini-game trực quan kéo thả, phân loại để củng cố kiến thức nền tảng (đạt hiểu biết Tier B).\n3. **Scenario Challenge (Thử thách tình huống)**: Đối mặt với các câu hỏi trắc nghiệm đưa ra quyết định hành động tối ưu trong thế giới giả lập (đạt năng lực lựa chọn Tier C).\n4. **Boss Battle (Quyết đấu Boss)**: Trận đấu kịch tính để đánh bại Boss bằng cách nhận diện các hành vi sai của Boss và đưa ra hành động khắc phục kịp thời (đạt năng lực đánh giá Tier D).\n5. **AI Reflection (Phản tư cùng AI)**: Hội thoại tự do (bằng giọng nói hoặc chữ viết) với AI Companion Nova để rút ra bài học bản thân và cam kết hành động thực tế (đạt năng lực phản tư Tier E).\n6. **Real-life Mission (Nhiệm vụ ngoài đời)**: AI tự động phân tích và sinh ra một nhiệm vụ thực tế nhỏ, an toàn tại nhà hoặc trường học phù hợp bối cảnh của học sinh.\n7. **Parent Verification (Xác thực từ phụ huynh)**: Phụ huynh kiểm chứng hành động/sản phẩm thực tế của con và bấm xác nhận đạt trên ứng dụng Phụ huynh.\n8. **Competency Mastered (Đạt năng lực thành thạo)**: Hệ thống chính thức công nhận trẻ đạt Mastery, trao tặng Huy hiệu Vàng độc bản và ghi nhận vào học bạ năng lực số.\n\n### Educational Basis\n* **Lý thuyết Học tập Kiến tạo (Constructivism - Jean Piaget)**: Trẻ tự xây dựng kiến thức thông qua việc tương tác trực tiếp với môi trường.\n* **Nguyên lý Sư phạm Hành vi (Behaviorism)**: Củng cố tích cực thông qua phần thưởng tức thời trong game tạo động lực lặp lại hành vi.\n\n### Trade-offs\n* **Sự đánh đổi**: Lộ trình 9 bước là rất dài và có thể gây cảm giác nản lòng nếu trẻ muốn đi nhanh.\n* **Quyết định**: Thiết kế cơ chế \"Lưu tiến trình\" linh hoạt, trẻ có thể dừng lại ở bất kỳ bước nào và quay lại sau mà không bị phạt.\n\n### Advantages\n* Đảm bảo tính khoa học chặt chẽ về mặt sư phạm, chuyển đổi kiến thức ngắn hạn thành trí nhớ dài hạn.\n* Tạo ra trải nghiệm học mà chơi vô cùng tự nhiên.\n\n### Risks\n* Trẻ bỏ cuộc trước khi chuyển sang bước thực hiện nhiệm vụ ngoài đời.\n* *Biện pháp giảm thiểu*: Gắn phần thưởng trong game (vàng, trang phục avatar) rất lớn vào bước nộp bằng chứng thực tế để thu hút trẻ.\n\n### Dependencies\n* Logic chuyển cảnh của Game Client phải tuân thủ nghiêm ngặt thứ tự mở khóa của lộ trình này.\n\n### Future Impact\nVòng lặp tiến bộ này sẽ được giữ nguyên khi mở rộng sang cấp THCS/THPT, chỉ thay đổi độ phức tạp của cốt truyện và tính chất của nhiệm vụ đời thực.\n\n---\n\n## 6. KHUNG ĐÁNH GIÁ NĂNG LỰC (ASSESSMENT FRAMEWORK)\n\n### Purpose\nĐịnh nghĩa hệ thống công cụ đánh giá đa chiều, toàn diện giúp đo lường chính xác sự tiến bộ của trẻ mà không tạo cảm giác áp lực hay sợ hãi thi cử.\n\n### Design Rationale\nChúng tôi loại bỏ hoàn toàn các bài kiểm tra tính điểm số, xếp hạng học sinh một cách tiêu cực. Thay vào đó, hệ thống đánh giá của NovaStars là một **Hệ thống Đánh giá Lồng ghép (Embedded & Authentic Assessment)**. Việc đánh giá diễn ra một cách tự nhiên bên trong các hoạt động chơi game, đối thoại AI và làm nhiệm vụ thực tế. Đánh giá không chỉ để xếp loại, mà là công cụ để chẩn đoán (Diagnostic) và định hình (Formative) lộ trình học tập của trẻ.\n\n```\n       [ Chẩn đoán ban đầu ] (Pre-test ẩn dưới dạng trò chơi khám phá)\n                  │\n                  ▼\n       [ Đánh giá định hình ] (Formative: Mini-games, Thử thách tình huống)\n                  │\n                  ▼\n       [ Đánh giá tổng kết ] (Summative: Boss Battle nhận thức)\n                  │\n                  ▼\n       [ Đánh giá thực chất ] (Authentic: Nhiệm vụ đời thực + Phản tư + Phụ huynh)\n```\n\n### Chi tiết các công cụ đánh giá:\n1. **Pre-test (Chẩn đoán ẩn)**: Thiết kế dưới dạng một mini-game trắc nghiệm tình huống ngắn khi trẻ lần đầu vào một đảo năng lực mới, giúp xác định mức độ nhận biết ban đầu của trẻ để AI Companion đề xuất lộ trình phù hợp.\n2. **Game Assessment (Đánh giá qua game)**: Tích hợp vào mini-games (Tier A, Tier B). Hệ thống ghi nhận số lần thử lại (Retry Count), thời gian suy nghĩ để đánh giá tốc độ xử lý thông tin của trẻ.\n3. **Boss Battle (Đánh giá nhận thức nâng cao)**: Thử thách giải quyết tình huống phức tạp (Tier D). Học sinh đóng vai trò là \"Trọng tài hành vi\", đánh giá lỗi sai của nhân vật khác và đề xuất cách sửa đổi.\n4. **Open Response & Reflection (Đánh giá phản tư tự do)**: Học sinh trả lời câu hỏi mở bằng giọng nói hoặc văn bản (Tier E). AI Companion phân tích ngôn ngữ tự nhiên để đánh giá độ thấu cảm, khả năng tự nhận thức.\n5. **Real-life Task (Nhiệm vụ đời thực)**: Đánh giá khả năng chuyển dịch năng lực ra môi trường thực tế (Authentic Assessment).\n6. **Parent Verification (Xác thực từ phụ huynh)**: Phụ huynh kiểm chứng hành vi thực tế dựa trên bảng câu hỏi định hướng cực kỳ đơn giản (ví dụ: \"Trẻ có tự sắp xếp đồ đạc mà không cần nhắc nhở không?\").\n7. **Adaptive Assessment (Đánh giá thích ứng)**: Nếu học sinh làm sai ở một cấp độ nhận thức nhất định, hệ thống sẽ tự động hạ độ khó hoặc đề xuất các hoạt động bổ trợ thay vì chỉ báo lỗi.\n\n### Educational Basis\n* **Authentic Assessment (Grant Wiggins)**: Đánh giá năng lực thực sự phải thông qua việc thực hiện các nhiệm vụ có ý nghĩa thực tế, giống như cách người lớn làm việc trong đời sống.\n* **Formative Assessment (Dylan Wiliam)**: Sử dụng kết quả đánh giá để điều chỉnh hoạt động dạy và học ngay lập tức nhằm cải thiện chất lượng học tập.\n\n### Trade-offs\n* **Sự đánh đổi**: Đánh giá hành vi thực tế và phản tư mở của trẻ khó đạt được tính khách quan tuyệt đối như trắc nghiệm lý thuyết máy chấm.\n* **Quyết định**: Chấp nhận tính tương đối về mặt điểm số số lượng, tập trung vào tính định tính (Qualitative) của bằng chứng và sự cải thiện hành vi liên tục của trẻ (Growth Curve).\n\n### Advantages\n* Học sinh hoàn toàn không có cảm giác bị \"kiểm tra\", giảm thiểu tối đa áp lực tâm lý.\n* Đánh giá được các năng lực phi học thuật (Non-cognitive skills) như sự kiên trì, lòng trắc ẩn, khả năng ứng phó sự cố.\n\n### Risks\n* Phụ huynh có thể đánh giá quá bao dung (lỗi thiên vị) hoặc quá khắt khe đối với con mình.\n* *Biện pháp giảm thiểu*: Cung cấp hướng dẫn đánh giá (Rubrics) cực kỳ rõ ràng, trực quan bằng hình ảnh cho phụ huynh trên Dashboard.\n\n### Dependencies\n* Module AI NLP phải có khả năng xử lý tiếng Việt trẻ em ổn định để chấm điểm Reflection.\n\n### Future Impact\nHồ sơ đánh giá đa chiều này là minh chứng thuyết phục nhất về sự trưởng thành của học sinh, vượt trội hơn mọi bảng điểm học thuật truyền thống.\n\n---\n\n## 7. BẰNG CHỨNG NĂNG LỰC (COMPETENCY EVIDENCE)\n\n### Purpose\nXác định cấu trúc dữ liệu và các loại bằng chứng cụ thể chứng minh trẻ đã thực sự thực hiện hành vi đạt chuẩn trong thế giới thực.\n\n### Design Rationale\nChúng tôi định nghĩa **Evidence (Bằng chứng)** là hạt nhân cốt lõi để công nhận Mastery. Không có bằng chứng, năng lực chỉ là giả thuyết. Bằng chứng phải đa dạng phương thức (Multi-modal) để phù hợp với độ tuổi của trẻ em tiểu học (trẻ lớp 1 thích ghi âm hơn viết chữ) và phản ánh trung thực môi trường sinh hoạt của trẻ.\n\n```\n                  ┌──► Ảnh chụp sản phẩm (Photo Evidence)\n                  ├──► Ghi âm thuyết trình/Phản tư (Voice Evidence)\nEvidence Types ───┼──► Video thực hiện nhiệm vụ (Video Evidence)\n                  ├──► Nhật ký quan sát của phụ huynh (Parent Check Log)\n                  └──► Nhật ký hành vi tự động (Behavior Log)\n```\n\n### Chi tiết các loại bằng chứng:\n1. **Parent Check (Xác thực của phụ huynh)**: Câu trả lời Có/Không kèm theo đánh giá nhanh của phụ huynh về nhiệm vụ của trẻ.\n2. **Teacher Observation (Quan sát của giáo viên - nếu áp dụng trong trường học)**: Nhận xét ngắn từ giáo viên về biểu hiện của trẻ ở lớp học.\n3. **Photo Evidence (Bằng chứng hình ảnh)**: Ảnh chụp sản phẩm trẻ tự làm (ví dụ: góc học tập ngăn nắp, đĩa ăn đủ màu sắc, nhãn cảnh báo nóng tự vẽ).\n4. **Video Evidence (Bằng chứng video - tùy chọn)**: Video ngắn (dưới 30 giây) quay lại cảnh trẻ thực hành kỹ năng (ví dụ: tự gấp quần áo, hướng dẫn em nhỏ rửa tay).\n5. **Voice Evidence (Bằng chứng giọng nói)**: File ghi âm trẻ trả lời câu hỏi phản tư hoặc thuyết trình ngắn gửi cho AI Companion.\n6. **Reflection Logs (Nhật ký phản tư)**: Nội dung văn bản ghi lại câu trả lời phản tư của trẻ.\n7. **Behavior Log (Nhật ký hành vi tự động)**: Dữ liệu ghi nhận từ hệ thống game về các lựa chọn hành vi của trẻ trong môi trường giả lập.\n\n### Educational Basis\n* **Evidence-Centered Design (ECD - Mislevy et al.)**: Thiết kế đánh giá xoay quanh bằng chứng, liên kết trực tiếp giữa các suy luận về năng lực của học sinh với các hành động cụ thể mà học sinh thực hiện.\n\n### Trade-offs\n* **Sự đánh đổi**: Lưu trữ dữ liệu media (ảnh, video, giọng nói) của trẻ em gây tốn kém dung lượng lưu trữ trên Cloud và đặc biệt nhạy cảm về vấn đề bảo mật thông tin cá nhân.\n* **Quyết định**: Bắt buộc mã hóa toàn bộ dữ liệu đa phương tiện của trẻ, không chia sẻ công khai khi chưa có sự đồng ý bằng văn bản của phụ huynh. Hạn chế độ phân giải ảnh/video để giảm dung lượng lưu trữ.\n\n### Advantages\n* Tạo ra một danh mục năng lực số (Digital Competency Portfolio) sinh động, đầy tự hào cho trẻ và gia đình.\n* Giúp phụ huynh nhìn thấy sự tiến bộ hữu hình của con mình theo thời gian.\n\n### Risks\n* Nguy cơ rò rỉ dữ liệu hình ảnh/giọng nói của học sinh.\n* *Biện pháp giảm thiểu*: Lưu trữ trên Firebase Storage với các luật bảo mật (Security Rules) nghiêm ngặt nhất, tự động xóa siêu dữ liệu vị trí (metadata GPS) của hình ảnh khi tải lên.\n\n### Dependencies\n* Hệ thống Cloud Storage và API Upload hoạt động mượt mà ngay cả trong điều kiện mạng yếu.\n\n### Future Impact\nBằng chứng năng lực tích lũy qua nhiều năm sẽ trở thành tài sản vô giá minh chứng cho sự phát triển toàn diện của trẻ khi nộp hồ sơ vào các cấp học cao hơn.\n\n---\n\n## 8. TIÊU CHÍ THÀNH THẠO (MASTERY CRITERIA)\n\n### Purpose\nXác lập bộ quy tắc định lượng và định tính rõ ràng để hệ thống tự động đưa ra quyết định công nhận học sinh đã đạt mức độ Thành thạo (Mastery) đối với một kỹ năng.\n\n### Design Rationale\nChúng tôi thiết kế tiêu chí Mastery tích hợp nhiều điều kiện (Multi-gated Mastery) để đảm bảo trẻ không thể \"học vẹt\" hoặc chỉ nhấn nút qua màn. Để được công nhận Mastery, học sinh phải chứng minh cả năng lực nhận thức lý thuyết, khả năng xử lý tình huống mô phỏng, tư duy phản tư sâu sắc và hành động thực tế được xác nhận.\n\n```\n       [ Vượt qua Boss Battle ] (Nhận thức đạt Tier D - Đánh giá)\n                 AND\n      [ Hoàn thành Reflection ] (Phản tư đạt Tier E - Trí tuệ cảm xúc)\n                 AND\n    [ Nhiệm vụ đời thực hoàn thành ] (Hành động thực tế có minh chứng)\n                 AND\n    [ Xác nhận đạt từ Phụ huynh ] (Kiểm chứng từ môi trường sống)\n                 ▼\n          [ ĐẠT MASTERY ]\n```\n\n### Các điều kiện bắt buộc để đạt Mastery:\n1. **Cognitive Pass (Đạt nhận thức lý thuyết)**: Trả lời đúng ít nhất **80%** ngân hàng câu hỏi tình huống của kỹ năng (tương đương 16/20 câu hỏi LSCAF).\n2. **Boss Battle Defeated (Chiến thắng Boss)**: Vượt qua thử thách đấu Boss ở cuối màn (Tier D) mà không cần xem gợi ý trợ giúp quá 2 lần.\n3. **Reflection Approved (Phản tư được duyệt)**: Câu trả lời phản tư (Tier E) được AI đánh giá đạt độ chân thành và liên hệ thực tế phù hợp (không nói sáo rỗng hoặc trả lời một chữ).\n4. **Real-life Mission Completed (Hoàn thành nhiệm vụ thực tế)**: Nộp đầy đủ bằng chứng (Ảnh/Giọng nói/Video) của ít nhất **01 nhiệm vụ thực tế** được chỉ định.\n5. **Parent Sign-off (Xác nhận của phụ huynh)**: Phụ huynh đánh giá đạt trên dashboard phụ huynh cho nhiệm vụ đó.\n\n### Educational Basis\n* **Mastery Learning Model (Bloom)**: Định nghĩa sự thành thạo yêu cầu học sinh đạt được một mức độ năng lực tối thiểu được xác định rõ ràng trên tất cả các phương diện nhận thức và hành động trước khi tiến lên.\n\n### Trade-offs\n* **Sự đánh đổi**: Tiêu chí quá chặt chẽ sẽ khiến tỷ lệ học sinh đạt Mastery trên app giảm xuống, có thể làm giảm cảm giác thỏa mãn tức thời của trẻ so với các game thông thường.\n* **Quyết định**: Giữ vững tiêu chuẩn cao này vì mục tiêu cuối cùng là thay đổi hành vi thật. Tuy nhiên, bù đắp bằng cách thiết kế hệ thống phần thưởng trung gian (như quà tặng khi thắng Boss, huy chương bạc nhận thức khi hoàn thành học trên app) để giữ động lực cho trẻ.\n\n### Advantages\n* Thương hiệu NovaStars được định vị uy tín: Chứng nhận Mastery của NovaStars có giá trị thực chất, phản ánh đúng hành vi của trẻ ngoài đời.\n* Trẻ học được tính kiên trì và tôn trọng các cam kết hành động thực tế.\n\n### Risks\n* Phụ huynh không nhấn nút duyệt khiến trẻ không thể đạt Mastery mặc dù đã làm xong mọi việc.\n* *Biện pháp giảm thiểu*: AI Companion sẽ tự động duyệt tạm thời (Provisional Mastery) sau 5 ngày nếu phụ huynh không phản hồi, nhưng sẽ gửi thông báo khích lệ phụ huynh vào phê duyệt để chính thức mở khóa Huy hiệu Vàng.\n\n### Dependencies\n* Logic kiểm tra điều kiện Mastery trên Backend Functions phải được lập trình chính xác và tối ưu hóa truy vấn.\n\n### Future Impact\nThiết lập một chuẩn mực mới trong EdTech: Mastery không phải là hoàn thành 100% bài học trực tuyến, mà là hoàn thành chu trình từ nhận thức đến hành động ngoài đời thực.\n\n---\n\n## 9. CHÍNH SÁCH ĐÁNH GIÁ CỦA AI (AI ASSESSMENT POLICY)\n\n### Purpose\nXác định giới hạn quyền lực của Trí tuệ Nhân tạo (AI) trong việc đánh giá học sinh, bảo đảm tính nhân văn, an toàn tuyệt đối và sự tham gia cần thiết của con người (Human-in-the-loop).\n\n### Design Rationale\nChúng tôi tin rằng AI là một công cụ hỗ trợ tuyệt vời để cá nhân hóa giáo dục nhưng **AI không bao giờ được phép thay thế hoàn toàn con người trong việc đưa ra các phán xét mang tính đạo đức, tâm lý hoặc chứng nhận cuối cùng**. AI của NovaStars được huấn luyện để đóng vai trò là người đồng hành khích lệ, chấm điểm các nhiệm vụ mang tính định tính nhẹ nhàng và lọc dữ liệu thô, trong khi phụ huynh và giáo viên giữ quyền quyết định tối cao ở các thời điểm nhạy cảm.\n\n```\n                         ┌──► Đánh giá cảm xúc & Độ chân thành của Reflection\n                         ├──► Gợi ý nhiệm vụ đời thực cá nhân hóa\nAI evaluates ────────────┼──► Kiểm tra tính hợp lệ sơ bộ của bằng chứng (ảnh, giọng nói)\n                         └──► Phân tích lỗ hổng kiến thức để điều chỉnh độ khó game\n                         \n                         ┌──► Không phán xét đạo đức hay tính cách của trẻ\nAI does NOT evaluate ────┼──► Không đưa ra kết luận tâm lý lâm sàng\n                         └──► Không tự ý quyết định đạt Mastery khi thiếu xác thực của phụ huynh\n```\n\n### Phân vai chi tiết:\n1. **AI được đánh giá**:\n   * *Reflection Sentiment & Coherence*: Đọc/nghe câu trả lời phản tư (Tier E) để đánh giá xem trẻ có hiểu bài học và liên hệ đúng thực tế không.\n   * *Evidence Validation (Sơ bộ)*: Kiểm tra xem ảnh tải lên có chứa nội dung rác, không liên quan hoặc không an sau hay không (ví dụ: ảnh tải từ mạng, ảnh trống).\n   * *Learning Analytics*: Đánh giá tốc độ phản hồi, số lần chọn sai để phân tích lỗ hổng nhận thức của trẻ.\n2. **AI TUYỆT ĐỐI KHÔNG ĐƯỢC đánh giá**:\n   * *Đạo đức & Nhân cách của trẻ*: Tuyệt đối không dán nhãn trẻ là \"ngoan\", \"hư\", \"lười biếng\", \"kém thông minh\".\n   * *Đánh giá sức khỏe tinh thần*: Không đưa ra các chẩn đoán tâm lý lâm sàng (ví dụ: tăng động, tự kỷ, trầm cảm).\n   * *Quyết định Mastery cuối cùng*: AI không thể tự quyết định trẻ đã thành thạo kỹ năng sống nếu chưa có sự xác nhận thực tế từ phụ huynh hoặc giáo viên.\n3. **Khi nào cần Phụ huynh (Parent Gate)**:\n   * Khi cần xác nhận xem hành vi của trẻ ở nhà đã thực sự thay đổi hay chưa (ví dụ: con có thực sự tự dọn bát sau khi ăn không?).\n   * Khi nhiệm vụ đời thực liên quan đến các yếu tố vật lý cần giám sát an toàn (bếp núc, giao thông, đi lạc).\n4. **Khi nào cần Giáo viên (Teacher Gate - nếu dùng trong trường học)**:\n   * Khi trẻ có các biểu hiện hành vi bất thường trong câu trả lời phản tư (ví dụ: thể hiện xu hướng bạo lực, tự làm hại bản thân, bị bạo hành gia đình). AI Companion phải kích hoạt hệ thống cảnh báo đỏ (Red Flag Alert) gửi ngay lập tức tới nhà trường và chuyên gia tâm lý con người để can thiệp.\n\n### Educational Basis\n* **Ethics of AI in Education (UNICEF Guidelines)**: Bảo vệ quyền riêng tư của trẻ em, tránh thiên vị thuật toán, đảm bảo tính giải trình và luôn giữ con người làm chủ quyết định cuối cùng (Human-Agency).\n\n### Trade-offs\n* **Sự đánh đổi**: Phụ thuộc vào con người làm chậm tiến trình học tập của trẻ và tăng khối lượng công việc cho phụ huynh/giáo viên.\n* **Quyết định**: An toàn và đạo đức là trên hết. Chấp nhận tốc độ chậm để bảo vệ sự phát triển lành mạnh của trẻ.\n\n### Advantages\n* Ngăn chặn các sự cố khủng hoảng truyền thông hoặc tâm lý do AI phản hồi sai lệch.\n* Tạo dựng niềm tin tuyệt đối từ phụ huynh và các trường học.\n\n### Risks\n* AI nhận diện nhầm lẫn một câu trả lời phản tư sâu sắc của trẻ là rác do lỗi ngôn ngữ địa phương hoặc cách diễn đạt ngây ngô của trẻ em.\n* *Biện pháp giảm thiểu*: Huấn luyện AI với tập dữ liệu mẫu lớn về ngôn ngữ trẻ em Việt Nam theo từng vùng miền. Cung cấp nút \"Khiếu nại gửi bố mẹ\" để phụ huynh có thể ghi đè (override) quyết định của AI nếu AI chấm sai.\n\n### Dependencies\n* Hệ thống phân tích văn bản và giọng nói của API Gemini phải được cấu hình bộ lọc an toàn trẻ em (Safety Settings) ở mức cao nhất.\n\n### Future Impact\nThiết lập tiêu chuẩn đạo đức AI hàng đầu trong ngành EdTech Việt Nam và quốc tế.\n\n---\n\n## 10. THIẾT KẾ VAI TRÒ CỦA PHỤ HUYNH (PARENT ROLE)\n\n### Purpose\nTái định nghĩa trải nghiệm của phụ huynh từ người giám sát thụ động thành người đồng hành chủ động, huấn luyện viên (Coach) và nguồn động viên tinh thần lớn nhất của trẻ.\n\n### Design Rationale\nChúng tôi kiên quyết chống lại mô hình phụ huynh chỉ là người nhấn nút \"Phê duyệt\" vô hồn. Trẻ em tiểu học khao khát sự chú ý và công nhận từ cha mẹ hơn bất kỳ ai. Chúng tôi thiết kế **Hành trình Phụ huynh đồng hành (Parent Companion Journey)** tích hợp sâu vào tiến trình học tập của con, cung cấp các gợi ý hành động cụ thể để cha mẹ tương tác trực tiếp với con ngoài đời thực.\n\n```\n       [ Thông báo tiến trình ] (Thông tin về hòn đảo con đang học)\n                  │\n                  ▼\n   [ Gợi ý trò chuyện tối nay ] (3 câu hỏi đơn giản để thảo luận với con)\n                  │\n                  ▼\n [ Hướng dẫn làm nhiệm vụ chung ] (Hoạt động gắn kết gia đình vào cuối tuần)\n                  │\n                  ▼\n   [ Đánh giá & Trao huy hiệu ] (Ghi nhận bằng chứng thực tế và khen ngợi)\n```\n\n### Các vai trò cụ thể của phụ huynh:\n1. **The Coach (Người hướng dẫn)**: Nhận các chỉ dẫn siêu ngắn (Coaching Tips) từ ứng dụng để biết cách hướng dẫn con thực hiện các kỹ năng khó (ví dụ: cách dạy con dùng kéo an toàn theo từng bước).\n2. **The Observer (Người quan sát)**: Quan sát và ghi nhận các thay đổi hành vi nhỏ nhất của con trong sinh hoạt hàng ngày (ví dụ: hôm nay con đã tự giác chào hỏi bác bảo vệ).\n3. **The Encourager (Người động viên)**: Nhận thông báo khi con vượt qua các thử thách khó hoặc đấu Boss để kịp thời khen ngợi con ngoài đời thực, hoặc gửi tin nhắn thoại khích lệ trực tiếp vào app của con.\n4. **The Co-player (Người cùng chơi)**: Tham gia vào các nhiệm vụ gia đình (Family Missions) cùng con vào cuối tuần (ví dụ: cả nhà cùng lập bản đồ thoát hiểm hoả hoạn của gia đình).\n5. **The Feedback Provider (Người phản hồi định kỳ)**: Trả lời khảo sát ngắn hàng tuần về mức độ tự lập và an toàn của con để hệ thống hiệu chỉnh lộ trình thích ứng.\n\n### Educational Basis\n* **Lý thuyết Gắn kết Gia đình (Family Engagement Theory - Epstein)**: Sự tham gia tích cực của gia đình vào quá trình học tập của trẻ là yếu tố dự báo mạnh mẽ nhất cho sự thành công trong học tập và phát triển cảm xúc của học sinh.\n\n### Trade-offs\n* **Sự đánh đổi**: Đòi hỏi phụ huynh dành thời gian tương tác có thể gây phiền toái cho những phụ huynh quá bận rộn, dẫn đến việc họ gỡ cài đặt ứng dụng.\n* **Quyết định**: Thiết kế trải nghiệm của phụ huynh cực kỳ tinh gọn. Mọi tương tác của phụ huynh trên ứng dụng phải được hoàn thành trong vòng dưới **1 phút mỗi ngày**. Các nhiệm vụ cuối tuần là hoàn toàn tự nguyện nhưng có phần thưởng hấp dẫn cho cả nhà.\n\n### Advantages\n* Biến việc học kỹ năng sống thành hoạt động gắn kết tình cảm gia đình thực chất.\n* Phụ huynh trực tiếp kiểm chứng được giá trị của ứng dụng, tăng khả năng gia hạn gói dịch vụ (LTV - Lifetime Value).\n\n### Risks\n* Phụ huynh làm hộ con để con nhanh đạt phần thưởng trong game.\n* *Biện pháp giảm thiểu*: AI Companion sẽ hỏi trẻ một vài câu hỏi ngẫu nhiên trong game về cách trẻ thực hiện nhiệm vụ ngoài đời để kiểm tra chéo tính xác thực.\n\n### Dependencies\n* Giao diện Dashboard Phụ huynh phải được tối ưu hóa hiển thị trên di động và dễ sử dụng với mọi trình độ công nghệ của cha mẹ.\n\n### Future Impact\nXây dựng một cộng đồng cha mẹ thông thái, chủ động đồng hành cùng sự phát triển toàn diện của con cái.\n\n---\n\n## 11. HỆ THỐNG PHÂN TÍCH HỌC TẬP (LEARNING ANALYTICS ENGINE)\n\n### Purpose\nXác định các chỉ số đo lường (telemetry), cấu trúc lưu trữ và mô hình phân tích dữ liệu để vẽ nên bức tranh toàn diện về năng lực học sinh phục vụ cho AI cá nhân hóa và báo cáo phụ huynh.\n\n### Design Rationale\nChúng tôi không thu thập dữ liệu rác. Mọi điểm dữ liệu (datapoint) được lưu trữ đều phải có mục đích phục vụ cho việc cải tiến thuật toán cá nhân hóa của AI hoặc hiển thị trực quan hóa sự tiến bộ thực tế trên Dashboard Phụ huynh. Hệ thống phân tích học tập của NovaStars kết hợp giữa các dữ liệu định lượng trong game và dữ liệu định tính ngoài đời thực để tạo ra **Đường cong Tăng trưởng Năng lực Đa chiều (Multi-dimensional Growth Curve)**.\n\n```\n                  ┌──► Điểm số Năng lực Nhận thức (Cognitive Skill Score)\n                  ├──► Chỉ số Thử lại & Kiên trì (Persistence Index)\nLearning Analytics┼──► Tỷ lệ Hoàn thành Nhiệm vụ Đời thực (Real-life Mission Rate)\n                  ├──► Chỉ số Phản tư (Reflection Quality Rating)\n                  └──► Tốc độ Phản hồi & Xử lý Tình huống (Response Velocity)\n```\n\n### Các nhóm dữ liệu lưu trữ cốt lõi:\n1. **Competency Score (Điểm số Năng lực)**: Tính toán riêng biệt cho từng kỹ năng vi mô dựa trên tỷ lệ trả lời đúng câu hỏi LSCAF (Tiers A-D).\n2. **Practice Count & Retry Count (Chỉ số nỗ lực)**: Số lần trẻ luyện tập lại mini-game và số lần chọn sai trước khi tìm ra đáp án đúng. Đây là chỉ số đo lường sự kiên trì (Grit) của trẻ.\n3. **Mission Completion Metrics (Chỉ số hành động)**: Tỷ lệ hoàn thành nhiệm vụ thực tế, thời gian trung bình từ khi nhận nhiệm vụ đến khi nộp bằng chứng.\n4. **Evidence Quality Rating (Độ sâu của bằng chứng)**: Đánh giá định tính của AI (thông qua phân tích NLP giọng nói/chữ viết) và đánh giá của phụ huynh về chất lượng bằng chứng của con.\n5. **Growth Curve Dynamics (Đường cong tăng trưởng)**: Biểu diễn sự thay đổi của các chỉ số năng lực theo thời gian thực (ví dụ: trẻ tiến từ Aware lên Mastery trong bao nhiêu ngày).\n6. **Parent Engagement Score (Chỉ số gắn kết của cha mẹ)**: Tần suất đăng nhập của cha mẹ, tốc độ phê duyệt nhiệm vụ, số lượng lời động viên cha mẹ gửi cho con.\n\n### Educational Basis\n* **Educational Data Mining (EDM)**: Khai thác dữ liệu giáo dục để phát hiện các mẫu hành vi học tập ẩn và dự báo sớm nguy cơ nản lòng của học sinh.\n* **Tâm lý học hành vi về Sự Kiên trì (Grit - Angela Duckworth)**: Sự nỗ lực và kiên trì thử lại quan trọng hơn năng khiếu bẩm sinh.\n\n### Trade-offs\n* **Sự đánh đổi**: Phân tích dữ liệu định tính (như ghi âm phản tư) đòi hỏi năng lực tính toán lớn của AI và làm tăng độ trễ hệ thống.\n* **Quyết định**: Thực hiện phân tích định tính không đồng bộ (Asynchronous analysis) trên nền tảng cloud, cập nhật báo cáo tiến độ cho phụ huynh theo định kỳ 24 giờ một lần thay vì tức thời từng giây để tiết kiệm tài nguyên.\n\n### Advantages\n* Cung cấp cho phụ huynh một báo cáo phân tích khoa học, chi tiết về điểm mạnh và điểm cần cải thiện của con mà không ứng dụng nào có được.\n* Giúp AI Companion tự động đề xuất bài học tiếp theo hoặc gợi ý phụ huynh trò chuyện với con đúng chủ đề con đang gặp khó khăn.\n\n### Risks\n* Thuật toán phân tích đưa ra kết luận sai lệch do thiếu mẫu dữ liệu ban đầu.\n* *Biện pháp giảm thiểu*: Đặt ngưỡng tin cậy (Confidence Threshold) cho AI. Nếu dữ liệu chưa đủ lớn, AI sẽ đưa ra các báo cáo ở mức độ quan sát chung chung thay vì kết luận cụ thể.\n\n### Dependencies\n* Module Analytics phải liên kết chặt chẽ với cơ sở dữ liệu động Firestore và dịch vụ BigQuery/Firebase Analytics.\n\n### Future Impact\nDữ liệu năng lực tích lũy của hàng triệu học sinh sẽ cung cấp những nghiên cứu giá trị cho ngành giáo dục tiểu học về xu hướng phát triển kỹ năng của trẻ em Việt Nam và khu vực.\n\n---\n\n## 12. KHẢ NĂNG MỞ RỘNG TRONG TƯƠNG LAI (FUTURE EXPANSION)\n\n### Purpose\nĐảm bảo tính linh hoạt kiến trúc để khung năng lực có thể dễ dàng mở rộng sang các đối tượng học sinh lớn hơn (THCS, THPT), thị trường quốc tế và môi trường doanh nghiệp mà không cần đập đi xây lại từ đầu.\n\n### Design Rationale\nChúng tôi thiết kế Khung năng lực NovaStars như một **Kiến trúc Mô-đun Cắm-Rút (Pluggable Modular Architecture)**. Cấu trúc lõi (Domain -> Cluster -> Skill -> Micro-skill) và nguyên lý CBE được giữ nguyên. Khi mở rộng đối tượng hoặc thị trường, chúng tôi chỉ cần thay đổi các tầng nội dung bên trong (Content Layer) như cốt truyện kể, mức độ phức tạp của game giả lập, và tính chất tự lập của các nhiệm vụ ngoài đời thực.\n\n```\n[ Lõi Framework: CBE + LSCAF + Vòng lặp Tiến bộ + Công nhận Mastery ] (Không đổi)\n                                   │\n      ┌────────────────────────────┼────────────────────────────┐\n      ▼                            ▼                            ▼\n[ Khối Tiểu học ]            [ Khối Trung học ]          [ Khối Quốc tế ]\n(6-11 tuổi: Trực quan,       (11-18 tuổi: Tư duy          (Đa ngôn ngữ, đa văn hóa,\n Mini-game, Phụ huynh)        biện luận, Tự quản lý)      bản địa hóa nhiệm vụ)\n```\n\n### Thiết kế mở rộng chi tiết:\n1. **Mở rộng lên THCS & THPT**:\n   * *Nội dung*: Thay thế cốt truyện phiêu lưu cổ tích bằng các câu chuyện nhập vai thực tế xã hội, hướng nghiệp, tình bạn và tình yêu tuổi học trò.\n   * *Cơ chế Game*: Giảm tính chất Mini-game kéo thả, tăng tính chất game mô phỏng quản lý (Simulation), giải đố logic phức tạp hoặc trò chơi chiến thuật.\n   * *Vai trò Phụ huynh*: Giảm bớt sự giám sát trực tiếp (Parent Verification), chuyển sang tự đánh giá của học sinh (Self-Assessment) kết hợp với đánh giá chéo từ bạn bè (Peer-Assessment) hoặc cố vấn (Mentor).\n2. **Mở rộng ra Thị trường Quốc tế**:\n   * *Bản địa hóa (Localization)*: Dịch thuật toàn bộ nội dung sang tiếng Anh, tiếng Tây Ban Nha...\n   * *Nhiệm vụ đời thực*: AI Companion tự động hiệu chỉnh nhiệm vụ đời thực bám sát đặc điểm địa lý, văn hóa của từng quốc gia (ví dụ: ở các nước ôn đới, nhiệm vụ phòng tránh đuối nước sẽ tập trung vào mùa hè hoặc bể bơi nước nóng trong nhà).\n3. **Mở rộng sang Đào tạo Doanh nghiệp (Corporate Training)**:\n   * Áp dụng cấu trúc này để đào tạo kỹ năng mềm cho nhân viên mới (Onboarding). Thay thế phụ huynh bằng Quản lý trực tiếp (Manager Verification) để chứng nhận Mastery công việc.\n\n### Educational Basis\n* **Học tập suốt đời (Lifelong Learning Framework - EU)**: Năng lực là một hành trình phát triển liên tục, không bị giới hạn bởi tuổi tác hay môi trường trường học.\n\n### Trade-offs\n* **Sự đánh đổi**: Thiết kế một khung năng lực quá rộng ngay từ đầu có thể làm loãng sự tập trung vào đối tượng tiểu học hiện tại.\n* **Quyết định**: Tập trung tối đa tối ưu hóa trải nghiệm cho học sinh tiểu học (6-11 tuổi) trong giai đoạn hiện tại. Các thiết kế mở rộng chỉ được cài cắm dưới dạng các \"giao diện API phần mềm\" và cấu trúc dữ liệu linh hoạt, không vội vàng sản xuất nội dung cho các khối lớp lớn hơn.\n\n### Advantages\n* Tiết kiệm hàng triệu USD chi phí tái cấu trúc hệ thống công nghệ khi công ty quyết định mở rộng quy mô kinh doanh sang các phân khúc khách hàng mới.\n* Thu hút được các nhà đầu tư lớn nhờ tầm nhìn dài hạn và khả năng mở rộng (Scalability) rõ ràng của sản phẩm.\n\n### Risks\n* Sự khác biệt quá lớn về tâm lý học lứa tuổi giữa tiểu học và trung học có thể khiến cấu trúc game hiện tại không còn sức hấp dẫn với học sinh lớn.\n* *Biện pháp giảm thiểu*: Tách biệt hoàn toàn giao diện ứng dụng (Skin UI) và phong cách đồ họa của khối tiểu học và khối trung học trên cùng một nền tảng cơ sở dữ liệu chung.\n\n### Dependencies\n* Lược đồ database phải sử dụng các trường dữ liệu tùy biến linh hoạt (như `metadata`, `tags`, `level_brackets`) để thích ứng dễ dàng.\n\n### Future Impact\nNovaStars có khả năng trở thành một nền tảng hạ tầng (Infrastructure) cung cấp giải pháp đánh giá năng lực cho nhiều đơn vị giáo dục khác trên toàn cầu.\n\n---\n\n## REVIEW & QUẢN TRỊ FRAMEWORK\n\n### Open Questions (Các câu hỏi mở cần thảo luận thêm với CLO & CPO)\n1. Có nên tích hợp cơ chế giáo viên trường học cùng phê duyệt Mastery với phụ huynh trong phiên bản trường học (NovaStars School Edition) không?\n2. Dung lượng tối đa cho mỗi file ghi âm phản tư của học sinh để tối ưu hóa chi phí server Firestore và chất lượng phân tích NLP của AI là bao nhiêu?\n3. Có nên cho phép học sinh nộp bằng chứng thay thế (Alternative Evidence) nếu gia đình không có điều kiện thực hiện một nhiệm vụ đời thực cụ thể không?\n\n### Assumptions (Các giả định thiết kế)\n* Giả định rằng ít nhất **70%** phụ huynh đăng ký sử dụng app sẽ sẵn lòng dành ra 1 phút mỗi ngày hoặc 5 phút cuối tuần để tương tác và xác thực năng lực cho con.\n* Giả định rằng mô hình Google Gemini API có khả năng xử lý ngôn ngữ nói tiếng Việt của trẻ em 6-11 tuổi với độ chính xác tối thiểu **85%** ở môi trường ít tiếng ồn.\n* Giả định rằng thiết bị di động của phụ huynh có kết nối internet tương đối ổn định để tải lên bằng chứng đa phương tiện.\n\n### Decision Log (Nhật ký quyết định quan trọng)\n* **📌 DEC-2026-002 [APPROVED]**: Áp dụng Khung Đánh giá Đa tầng LSCAF (Tiers A-E) tích hợp bắt buộc vào vòng lặp gameplay.\n* **📌 DEC-2026-003 [APPROVED]**: Quyết định Mastery yêu cầu bắt buộc có xác thực của phụ huynh (Parent Verification) ngoài đời thực mới được mở khóa Huy hiệu Vàng. AI chỉ đánh giá định tính phản tư và lọc bằng chứng rác.\n* **📌 DEC-2026-004 [APPROVED]**: Lưu trữ câu hỏi tĩnh (Static questions) ở client file (`questions_data.js`) để giảm chi phí vận hành database, chỉ lưu tiến trình động (Dynamic progress) trên Firestore.\n\n### Review Checklist (Bảng kiểm duyệt chất lượng nội dung kỹ năng)\n- [ ] Kỹ năng được phân rã thành ít nhất 3-5 Micro-skills cụ thể chưa?\n- [ ] 20 câu hỏi LSCAF được phân chia đều 5 tầng (mỗi tầng đúng 4 câu) chưa?\n- [ ] Câu hỏi tình huống có tránh được việc phán xét đúng/sai lý thuyết suông và tập trung vào hành vi thực tế chưa?\n- [ ] Nhiệm vụ ngoài đời thực có đảm bảo an toàn tuyệt đối và có kèm câu lệnh \"cần sự giám sát của cha mẹ\" chưa?\n- [ ] Tiêu chí Mastery đã bao gồm đầy đủ cả điều kiện định lượng (điểm game) và định tính (phản tư + phụ huynh duyệt) chưa?\n\n### Definition of Done (Tiêu chuẩn hoàn thành thiết kế khung năng lực)\n1. Tài liệu Khung năng lực chung (Tầng 1) được CLO và Hội đồng chuyên gia phê duyệt chất lượng sư phạm.\n2. Thiết kế mẫu chuẩn kỹ năng (Tầng 2) được đóng băng làm tài liệu hướng dẫn bắt buộc cho đội ngũ Content Production.\n3. Lược đồ cơ sở dữ liệu (Database Schema) tương thích hoàn toàn với thiết kế khung năng lực và đã được Technical Architect kiểm duyệt tính khả thi lập trình.\n\n### Recommendations cho Phase tiếp theo\n1. Tiến hành biên soạn thử nghiệm 03 kỹ năng mẫu đại diện cho 3 Domain khác nhau bám sát chuẩn `SKILL_TEMPLATE.md`.\n2. Lập trình thử nghiệm (POC - Proof of Concept) Module AI Companion chấm điểm giọng nói tiếng Việt của trẻ em để đo lường độ chính xác của API Gemini.\n3. Thiết kế bản vẽ phác thảo (Wireframe) giao diện Dashboard Phụ huynh tập trung vào sự tinh gọn và khích lệ cảm xúc tích cực.\n",
            skill_template: "# 📁 MẪU CHUẨN BIÊN SOẠN KỸ NĂNG (SKILL TEMPLATE)\n## TÀI LIỆU QUY CHUẨN THIẾT KẾ NỘI DUNG MỘT KỸ NĂNG CỐT LÕI (TIỂU HỌC)\n\n---\n\n## I. THIẾT KẾ CÁC THÀNH PHẦN MẪU CHUẨN (TEMPLATE COMPONENTS DESIGN)\n\nMỗi kỹ năng trong hệ thống NovaStars bắt buộc phải tuân thủ cấu trúc biên soạn 10 phần dưới đây.\n\n### 1. MỤC TIÊU NĂNG LỰC (COMPETENCY OBJECTIVES)\n* **Purpose**: Xác định rõ ràng các kết quả đầu ra kỳ vọng về mặt nhận thức, thái độ và hành vi mà trẻ cần đạt được sau khi hoàn thành bài học.\n* **Design Rationale**: Chúng tôi chia mục tiêu thành 3 mảng cốt lõi: Nhận thức (Biết/Hiểu), Lựa chọn (Đưa ra quyết định), và Hành vi thực tế (Hành động ngoài đời). Điều này đảm bảo nội dung biên soạn không sa đà vào lý thuyết suông mà luôn hướng tới đầu ra hành vi.\n* **Educational Basis**: Phân loại Bloom cải tiến (Cognitive Domain) kết hợp với Khung học tập cảm xúc - xã hội (CASEL).\n* **Trade-offs**: Việc chia nhỏ mục tiêu làm tăng thời gian biên soạn nội dung, nhưng giúp định hướng thiết kế game và câu hỏi trắc nghiệm cực kỳ chính xác.\n* **Advantages**: Giúp người biên soạn không bị lệch hướng mục tiêu ban đầu; hỗ trợ AI đo lường chính xác tiến độ của học sinh.\n* **Risks**: Mục tiêu quá trừu tượng, khó đo lường bằng hành động.\n* *Giảm thiểu*: Bắt buộc sử dụng các động từ hành động có thể đo lường (như *rút*, *chỉ ra*, *giải thích*, *tránh xa*) thay vì các động từ chung chung (như *biết*, *hiểu*, *học*).\n* **Dependencies**: Phải đồng bộ với bộ câu hỏi LSCAF của kỹ năng đó.\n* **Future Impact**: Đảm bảo các mục tiêu học tập có thể ánh xạ trực tiếp lên học bạ năng lực số.\n\n### 2. KIẾN THỨC NỀN (PREREQUISITE KNOWLEDGE)\n* **Purpose**: Liệt kê các thông tin, khái niệm khoa học cơ bản và các quy tắc cốt lõi làm nền tảng cho việc thực hành kỹ năng.\n* **Design Rationale**: Kiến thức nền là nguyên liệu đầu vào. Trẻ không thể đưa ra quyết định hành động đúng nếu không hiểu bản chất hiện tượng (ví dụ: cần hiểu nước dẫn điện trước khi học cách lau khô tay cắm điện). Kiến thức phải được trình bày đơn giản hóa tối đa bằng hình ảnh và ngôn ngữ trẻ em.\n* **Educational Basis**: Thuyết nhận thức học đường (Cognitive Load Theory) - hạn chế quá tải thông tin, chỉ cung cấp kiến thức thực sự cần thiết cho hành động.\n* **Trade-offs**: Cung cấp ít kiến thức hàn lâm chuyên sâu để nhường chỗ cho kiến thức ứng dụng thực tế.\n* **Advantages**: Trẻ dễ nhớ, dễ hiểu, tránh xa được các nguy hiểm ngay lập tức.\n* **Risks**: Giải thích quá đơn giản dẫn đến sai lệch bản chất khoa học.\n* *Giảm thiểu*: Nội dung kiến thức nền phải được kiểm duyệt bởi các chuyên gia Primary Education và Khoa học Tự nhiên.\n* **Dependencies**: Là nguồn nguyên liệu chính để biên soạn nội dung Story (Phần 5) và Mini-game (Phần 6).\n* **Future Impact**: Giúp học sinh hình thành tư duy khoa học thường thức ứng dụng suốt đời.\n\n### 3. KỸ NĂNG VI MÔ (MICRO-SKILLS)\n* **Purpose**: Phân rã kỹ năng cốt lõi thành các hành động, thao tác cực kỳ nhỏ và cụ thể để trẻ dễ dàng học và thực hiện.\n* **Design Rationale**: Đối với học sinh tiểu học, một khái niệm lớn như \"An toàn điện\" là quá mơ hồ. Chúng tôi phân rã thành các Micro-skills: nhận diện dây hở, lau tay khô trước khi cắm điện, rút phích cắm bằng cách cầm vào chuôi phích thay vì kéo dây.\n* **Educational Basis**: Phương pháp Giảng dạy Chia nhỏ (Task Analysis / Scaffolding) trong tâm lý học giáo dục.\n* **Trade-offs**: Việc phân rã chi tiết làm tăng số lượng thực thể dữ liệu cần quản lý trên cơ sở dữ liệu.\n* **Advantages**: AI Companion có thể phát hiện chính xác trẻ bị hổng ở thao tác nhỏ nào để kịp thời hỗ trợ và gợi ý bài học bổ trợ.\n* **Risks**: Phân rã quá sâu dẫn đến vụn vặt và mất đi tính tổng thể của kỹ năng.\n* *Giảm thiểu*: Giới hạn mỗi kỹ năng cốt lõi chỉ chứa từ **3 đến 5 Micro-skills**.\n* **Dependencies**: Mỗi Micro-skill phải liên kết trực tiếp với ít nhất một Mục tiêu học tập và một hoạt động trong game.\n* **Future Impact**: Cho phép xây dựng lộ trình học tập thích ứng siêu cá nhân hóa ở mức độ vi mô.\n\n### 4. CÁC LỖI THƯỜNG GẶP (COMMON PITFALLS & MISCONCEPTIONS)\n* **Purpose**: Chỉ ra những hiểu lầm, thói quen sai lệch hoặc hành vi nguy hiểm phổ biến của trẻ em tiểu học đối với kỹ năng đó.\n* **Design Rationale**: Học từ sai lầm (Learning from mistakes) là phương pháp học tập rất bền vững. Bằng cách định nghĩa trước các lỗi thường gặp, chúng tôi có thể chủ động thiết kế các tình huống gài bẫy trong game và huấn luyện AI Companion biết cách giải thích khi trẻ mắc lỗi.\n* **Educational Basis**: Thuyết thay đổi hành vi thông qua điều chỉnh nhận thức sai lệch (Cognitive Dissonance Theory).\n* **Trade-offs**: Phải nghiên cứu thực tế hành vi của trẻ rất nhiều để tìm ra các lỗi thực tế, không thể tự bịa ra.\n* **Advantages**: Game thiết kế kịch tính hơn, các câu hỏi trắc nghiệm thực chất hơn do đánh trúng tâm lý trẻ.\n* **Risks**: Trẻ có thể bắt chước hành vi sai nếu game minh họa không khéo.\n* *Giảm thiểu*: Tuyệt đối không hình ảnh hóa các hành vi sai một cách hấp dẫn, vui nhộn; Boss Battle phải là nơi phê phán các hành vi sai này.\n* **Dependencies**: Là cơ sở để biên soạn các phương án nhiễu (distractors) trong bộ câu hỏi trắc nghiệm tình huống.\n* **Future Impact**: Giúp học sinh rèn luyện tư duy phản biện, nhận diện và phòng tránh rủi ro trong cuộc sống.\n\n### 5. CÂU CHUYỆN BỐI CẢNH (NARRATIVE/STORY ARC)\n* **Purpose**: Tạo ra một bối cảnh giả tưởng hấp dẫn, giàu cảm xúc giúp trẻ kết nối tinh thần và có động lực học tập.\n* **Design Rationale**: Trẻ tiểu học học thông qua câu chuyện. Chúng tôi đặt trẻ vào vai một nhà thám hiểm (NovaStar) đồng hành cùng chú sao nhỏ Nova giải cứu các cư dân trên đảo khỏi các vấn đề rắc rối. Câu chuyện phải có nhân vật phản diện đáng yêu đại diện cho thói quen xấu.\n* **Educational Basis**: Giáo dục qua kể chuyện (Narrative Pedagogy) và Thiết kế game nhập vai (Avatar & Identity Theory).\n* **Trade-offs**: Chi phí viết kịch bản, vẽ tranh minh họa và Việt hóa/Quốc tế hóa câu chuyện rất lớn.\n* **Advantages**: Tăng tính cá nhân hóa và giữ chân trẻ học tập tự nguyện mà không cần ép buộc.\n* **Risks**: Câu chuyện quá dài gây xao nhãng việc tiếp thu kiến thức kỹ năng.\n* *Giảm thiểu*: Khống chế độ dài mỗi chương truyện dưới 150 chữ, kết hợp các đoạn thoại ngắn tương tác trực tiếp.\n* **Dependencies**: Đồng bộ chặt chẽ với Hướng nghệ thuật (Art Direction) của Design System.\n* **Future Impact**: Cốt truyện có thể mở rộng thành phim hoạt hình, truyện tranh xuất bản ngoài đời.\n\n### 6. CƠ CHẾ MINI-GAME PHÙ HỢP (MINI-GAME MECHANICS)\n* **Purpose**: Đề xuất các tương tác game hóa trực quan giúp trẻ thực hành và ghi nhớ kiến thức nền tảng (Tier A, Tier B).\n* **Design Rationale**: Tránh xa việc click chọn đáp án nhàm chán. Mỗi kỹ năng cần một cơ chế game phù hợp. Ví dụ: kỹ năng phân loại rác cần game kéo thả (Drag and Drop); kỹ năng an toàn điện cần game tìm điểm nguy hiểm trên bức tranh (Hidden Object).\n* **Educational Basis**: Play-based Learning (Học qua chơi) và Thuyết tương tác trực quan của trẻ em.\n* **Trade-offs**: Đội ngũ phát triển game phải lập trình nhiều loại gameplay khác nhau thay vì chỉ làm một mẫu quiz chuẩn.\n* **Advantages**: Tạo sự wowed và thích thú cho trẻ, giữ chân học sinh học hàng ngày.\n* **Risks**: Trẻ chỉ tập trung chơi game nhanh tay nhanh mắt mà không học được kỹ năng sống.\n* *Giảm thiểu*: Game phải thiết kế sao cho việc chiến thắng phụ thuộc hoàn toàn vào việc đưa ra quyết định đúng đắn về kỹ năng sống, không phụ thuộc vào phản xạ ngón tay nhanh chậm.\n* **Dependencies**: Phối hợp chặt chẽ với Game Design Bible.\n* **Future Impact**: Xây dựng kho mini-games đồ sộ, có thể tái sử dụng cho nhiều kỹ năng khác nhau.\n\n### 7. KỊCH BẢN ĐẤU BOSS (BOSS BATTLE SCENARIO)\n* **Purpose**: Thiết kế màn kiểm tra tổng kết nhận thức (Tier D) kịch tính, đòi hỏi trẻ vận dụng tổng hợp các kỹ năng vi mô để giải cứu thế giới game.\n* **Design Rationale**: Trận đấu Boss là đỉnh điểm của chương game. Boss (ví dụ: Quái vật Lười Biếng, Ngọn lửa Tinh Nghịch) sẽ tấn công bằng cách đưa ra các tình huống hành vi sai lệch. Học sinh phải đóng vai \"Trọng tài\", nhanh chóng chỉ ra lỗi sai của Boss và đưa ra hành động khắc phục để giành chiến thắng.\n* **Educational Basis**: Thuyết thử thách tăng dần (Flow Theory in Game Design) - cân bằng giữa độ khó thử thách và kỹ năng của người chơi.\n* **Trade-offs**: Thiết kế Boss Battle đòi hỏi tính mỹ thuật cao và lập trình kịch bản (Scripting) phức tạp.\n* **Advantages**: Tạo cảm giác thành tựu cực kỳ lớn cho trẻ khi vượt qua thử thách khó nhất trên màn hình app.\n* **Risks**: Độ khó quá cao khiến trẻ ức chế, khóc hoặc bỏ game.\n* *Giảm thiểu*: Cho phép AI Companion xuất hiện hỗ trợ, gợi ý khi trẻ trả lời sai 2 lần liên tiếp, không giới hạn mạng chơi.\n* **Dependencies**: Kịch bản Boss phải tích hợp các mục tiêu đánh giá nhận thức Tier D của bộ câu hỏi.\n* **Future Impact**: Boss Battle sẽ là mốc checkpoint dữ liệu quan trọng cho báo cáo phụ huynh.\n\n### 8. NHIỆM VỤ NGOÀI ĐỜI THỰC (REAL-LIFE MISSIONS)\n* **Purpose**: Đưa ra các nhiệm vụ hành động thực tế tại nhà hoặc trường học để chuyển hóa năng lực từ màn hình thiết bị ra đời thực.\n* **Design Rationale**: Đây là điểm cốt lõi của triết lý CBE. AI Companion sẽ phân tích độ tuổi, giới tính và môi trường của trẻ để đề xuất 1 nhiệm vụ phù hợp (ví dụ: con hãy đi quanh nhà cùng bố mẹ, tìm 3 ổ cắm điện bị hở hoặc quá thấp và dán nhãn cảnh báo). Nhiệm vụ phải cụ thể, dễ làm và an toàn.\n* **Educational Basis**: Experiential Learning (Kolb) và Học tập kết nối đời sống thực (Authentic Task).\n* **Trade-offs**: Tỷ lệ hoàn thành nhiệm vụ sẽ thấp hơn làm quiz online vì đòi hỏi hành động vật lý ngoài đời.\n* **Advantages**: Tạo ra giá trị thực sự cho gia đình, trẻ tự tin vào năng lực bản thân.\n* **Risks**: Trẻ gặp nguy hiểm khi thực hiện nhiệm vụ ngoài đời.\n* *Giảm thiểu*: Bắt buộc đính kèm câu lệnh: \"Nhiệm vụ này bắt buộc phải thực hiện cùng bố mẹ/người lớn\". Không đề xuất các nhiệm vụ nguy hiểm.\n* **Dependencies**: Dashboard của phụ huynh phải hiển thị được mô tả nhiệm vụ để phối hợp giám sát.\n* **Future Impact**: Trẻ phát triển thói quen tự lập và an toàn bền vững.\n\n### 9. YÊU CẦU BẰNG CHỨNG NĂNG LỰC (COMPETENCY EVIDENCE REQUIREMENTS)\n* **Purpose**: Đặc tả các loại bằng chứng số mà học sinh phải tải lên để chứng minh đã hoàn thành nhiệm vụ đời thực.\n* **Design Rationale**: Bằng chứng phải trực quan và sinh động. Chúng tôi yêu cầu nộp: 1 ảnh chụp sản phẩm (ví dụ: ảnh nhãn cảnh báo đã dán), hoặc 1 đoạn ghi âm giải thích của trẻ cho AI Companion. Bằng chứng được lưu vào hồ sơ năng lực cá nhân.\n* **Educational Basis**: Thiết kế đánh giá dựa trên bằng chứng (Evidence-Centered Design).\n* **Trade-offs**: Phụ huynh cảm thấy phiền phức khi chụp ảnh/quay video con rồi tải lên app.\n* **Advantages**: Cung cấp dữ liệu thực chất cho hệ thống đánh giá; là bằng chứng không thể chối cãi về sự tiến bộ của trẻ.\n* **Risks**: Rò rỉ dữ liệu riêng tư của trẻ em.\n* *Giảm thiểu*: Dữ liệu media được mã hóa đầu cuối và chỉ lưu hành nội bộ trong tài khoản gia đình. AI tự động làm mờ khuôn mặt trẻ nếu phụ huynh yêu cầu.\n* **Dependencies**: Module camera/micro trên app client phải tương thích tốt với Firebase Storage.\n* **Future Impact**: Tạo dựng kho tư liệu phát triển cá nhân (Growth Portfolio) quý giá cho trẻ khi lớn lên.\n\n### 10. TIÊU CHÍ MASTERY CHUYÊN BIỆT (MASTERY VALIDATION CRITERIA)\n* **Purpose**: Xác lập các chỉ số cụ thể để hệ thống chính thức công nhận trẻ đạt Mastery đối với kỹ năng chuyên biệt này.\n* **Design Rationale**: Thiết kế các chỉ số định lượng rõ ràng: Đạt bao nhiêu % câu hỏi, Boss Pass hay chưa, AI duyệt phản tư chưa, và Phụ huynh nhấn nút xác nhận đạt nhiệm vụ đời thực chưa.\n* **Educational Basis**: Mastery Learning (Bloom).\n* **Trade-offs**: Tiến trình đạt Mastery của trẻ sẽ bị kéo dài, đòi hỏi phụ huynh phải tích cực phối hợp.\n* **Advantages**: Đảm bảo chất lượng giáo dục thực chất; phụ huynh nhìn thấy kết quả rõ ràng.\n* **Risks**: Học sinh bị kẹt lại không đạt Mastery lâu ngày dẫn đến chán nản.\n* *Giảm thiểu*: Gửi thông báo khích lệ nhẹ nhàng cho phụ huynh hàng ngày để nhắc họ duyệt bài cho con.\n* **Dependencies**: Hệ thống thông báo đẩy (Push Notifications) trên Firebase Cloud Messaging.\n* **Future Impact**: Chứng nhận Mastery của NovaStars có uy tín cao đối với nhà trường và xã hội.\n\n---\n\n## II. MẪU SOẠN THẢO CHUẨN (STANDARDIZED MARKDOWN TEMPLATE)\n\n*Đội ngũ Content Production copy bộ khung dưới đây để soạn thảo kỹ năng mới:*\n\n```markdown\n# 📁 SKILL PROFILE: [Tên Kỹ Năng]\n## Nhóm kỹ năng: [Tên Nhóm] | Mã Kỹ Năng: [SKILL-XXX]\n\n### 1. MỤC TIÊU NĂNG LỰC (COMPETENCY OBJECTIVES)\nSau khi hoàn thành kỹ năng này, học sinh có khả năng:\n* **Nhận thức (Cognitive)**:\n  - [Mục tiêu 1: động từ hành động + đối tượng]\n  - [Mục tiêu 2]\n* **Quyết định (Decision Making)**:\n  - [Mục tiêu 3]\n  - [Mục tiêu 4]\n* **Hành vi đời thực (Real-life Behavior)**:\n  - [Mục tiêu 5]\n\n### 2. KIẾN THỨC NỀN (PREREQUISITE KNOWLEDGE)\n* **Quy tắc cốt lõi**:\n  - [Quy tắc 1]\n  - [Quy tắc 2]\n* **Khái niệm khoa học thường thức**:\n  - [Khái niệm 1]\n\n### 3. KỸ NĂNG VI MÔ (MICRO-SKILLS)\n* **Micro-skill 1**: [Tên thao tác cụ thể 1]\n* **Micro-skill 2**: [Tên thao tác cụ thể 2]\n* **Micro-skill 3**: [Tên thao tác cụ thể 3]\n* **Micro-skill 4**: [Tên thao tác cụ thể 4]\n\n### 4. CÁC LỖI THƯỜNG GẶP (COMMON PITFALLS & MISCONCEPTIONS)\n* **Lỗi 1**: [Mô tả lỗi hoặc hiểu lầm phổ biến của trẻ] -> *Hậu quả nguy hiểm*: [Mô tả].\n* **Lỗi 2**: [Mô tả lỗi hoặc hiểu lầm phổ biến của trẻ] -> *Hậu quả nguy hiểm*: [Mô tả].\n\n### 5. CÂU CHUYỆN BỐI CẢNH (NARRATIVE/STORY ARC)\n* **Tên câu chuyện**: [Tên hấp dẫn]\n* **Bối cảnh**: [Hòn đảo nào, vùng đất nào]\n* **Nhân vật**: [Nhà thám hiểm (học sinh), Nova, Boss/NPC nghịch ngợm]\n* **Tóm tắt cốt truyện**:\n  - [Đoạn 1: Giới thiệu bối cảnh, sự cố xảy ra]\n  - [Đoạn 2: Nova gợi mở kiến thức học tập]\n  - [Đoạn 3: Dẫn dắt tới Boss Battle]\n\n### 6. CƠ CHẾ MINI-GAME PHÙ HỢP (MINI-GAME MECHANICS)\n* **Mini-game 1: [Tên Mini-game]**\n  - *Gameplay*: [Kéo thả / Phân loại / Tìm vật ẩn...]\n  - *Mô tả tương tác*: [Cách trẻ thao tác để giải quyết kiến thức nền]\n* **Mini-game 2: [Tên Mini-game]**\n  - *Gameplay*: [Kéo thả / Phân loại / Tìm vật ẩn...]\n  - *Mô tả tương tác*: [Cách trẻ thao tác]\n\n### 7. KỊCH BẢN ĐẤU BOSS (BOSS BATTLE SCENARIO)\n* **Tên Boss**: [Ví dụ: Quái vật Điện Giật Volt-O]\n* **Bối cảnh Boss Battle**: [Địa điểm kịch tính]\n* **Cơ chế đối đầu**:\n  - *Boss ra chiêu*: [Đưa ra tình huống sai trái]\n  - *Học sinh phản công*: [Chỉ ra điểm sai và chọn hành động đúng]\n  - *Chiêu thức quyết định*: [Câu hỏi tình huống tổng hợp]\n\n### 8. NHIỆM VỤ NGOÀI ĐỜI THỰC (REAL-LIFE MISSIONS)\n* **Nhiệm vụ 1 (Dành cho Lớp 1-2)**: [Tên nhiệm vụ]\n  - *Mô tả chi tiết*: [Các bước thực hiện có cha mẹ giám sát]\n* **Nhiệm vụ 2 (Dành cho Lớp 3-5)**: [Tên nhiệm vụ]\n  - *Mô tả chi tiết*: [Các bước thực hiện có cha mẹ giám sát]\n\n### 9. YÊU CẦU BẰNG CHỨNG NĂNG LỰC (COMPETENCY EVIDENCE REQUIREMENTS)\n* **Bằng chứng bắt buộc**: [Ảnh chụp / Ghi âm / Video]\n  - *Mô tả bằng chứng đạt chuẩn*: [Ví dụ: Ảnh rõ nét, chụp sản phẩm tự làm...]\n* **Phỏng vấn Phản tư của AI (Tier E)**:\n  - *Câu hỏi AI*: \"[Câu hỏi mở để trẻ phản tư về nhiệm vụ đã làm]\"\n\n### 10. TIÊU CHÍ MASTERY CHUYÊN BIỆT (MASTERY VALIDATION CRITERIA)\nĐể đạt Mastery kỹ năng [Tên Kỹ Năng], học sinh phải:\n1. Trả lời đúng từ **16/20** câu hỏi tình huống LSCAF trở lên.\n2. Vượt qua trận đấu Boss [Tên Boss].\n3. AI Companion phê duyệt đoạn ghi âm phản tư đạt mức độ \"Chân thành & Hiểu bài\".\n4. Phụ huynh phê duyệt nhiệm vụ đời thực trên Dashboard Phụ huynh.\n```\n\n---\n\n## III. VÍ DỤ MINH HỌA HOÀN CHỈNH (CONCRETE EXAMPLE)\n\n*Dưới đây là một Skill Profile hoàn chỉnh được biên soạn bám sát mẫu chuẩn:*\n\n```markdown\n# 📁 SKILL PROFILE: Kỹ năng phòng tránh nguy cơ bị điện giật\n## Nhóm kỹ năng: Tự chăm sóc & An toàn | Mã Kỹ Năng: [SKILL-SAF-008]\n\n### 1. MỤC TIÊU NĂNG LỰC (COMPETENCY OBJECTIVES)\nSau khi hoàn thành kỹ năng này, học sinh có khả năng:\n* **Nhận thức (Cognitive)**:\n  - Nhận diện các khu vực nguy hiểm về điện trong nhà (ổ cắm điện, dây điện hở, thiết bị điện đang hoạt động).\n  - Giải thích được nguyên nhân tại sao tay ướt chạm vào điện rất dễ bị giật (Nước dẫn điện).\n* **Quyết định (Decision Making)**:\n  - Đưa ra lựa chọn đúng đắn: không tự ý cắm/rút điện khi không có người lớn giám sát; báo ngay cho người lớn khi thấy dây điện bị hở.\n* **Hành vi đời thực (Real-life Behavior)**:\n  - Luôn lau tay thật khô trước khi nhờ người lớn cắm/rút thiết bị điện.\n  - Tránh xa khu vực ổ cắm điện và không đút bất kỳ vật gì vào lỗ ổ điện.\n\n### 2. KIẾN THỨC NỀN (PREREQUISITE KNOWLEDGE)\n* **Quy tắc cốt lõi**:\n  - Không chạm tay ướt vào ổ điện, phích cắm hay bất kỳ thiết bị điện nào.\n  - Không tự ý sửa chữa hoặc cắm/rút điện nếu chưa có sự cho phép và giám sát của cha mẹ.\n  - Tránh xa các thiết bị điện đang tỏa nhiệt hoặc có dấu hiệu hỏng hóc (bốc khói, có tiếng xẹt lửa).\n* **Khái niệm khoa học thường thức**:\n  - Điện rất mạnh và di chuyển rất nhanh. Cơ thể con người chứa nhiều nước, và nước dẫn điện cực kỳ tốt. Nếu chạm vào nguồn điện, dòng điện sẽ truyền qua nước trong cơ thể gây bỏng, ngưng tim rất nguy hiểm.\n\n### 3. KỸ NĂNG VI MÔ (MICRO-SKILLS)\n* **Micro-skill 1**: Nhận diện nguồn điện và dây dẫn an toàn/không an toàn (phát hiện dây sờn, hở đồng).\n* **Micro-skill 2**: Thao tác lau khô tay bằng khăn khô trước khi tiếp cận khu vực có điện.\n* **Micro-skill 3**: Thao tác gọi điện thoại khẩn cấp hoặc gọi người lớn khi phát hiện sự cố chập điện.\n* **Micro-skill 4**: Quy tắc ứng phó khẩn cấp: Không chạm vào người đang bị điện giật mà phải dùng vật cách điện (chổi gỗ, nhựa) để gạt dây điện ra.\n\n### 4. CÁC LỖI THƯỜNG GẶP (COMMON PITFALLS & MISCONCEPTIONS)\n* **Lỗi 1**: Dùng tay ướt cắm sạc điện thoại vì nghĩ rằng sạc điện thoại dòng điện nhỏ nên không sao -> *Hậu quả nguy hiểm*: Sạc hỏng có thể rò điện lưới 220V trực tiếp gây giật chết người.\n* **Lỗi 2**: Dùng bút chì hoặc dĩa kim loại chọc vào lỗ ổ cắm điện để chơi đùa -> *Hậu quả nguy hiểm*: Kim loại dẫn điện từ lỗ ổ cắm truyền trực tiếp vào tay gây điện giật ngay lập tức.\n* **Lỗi 3**: Khi thấy bạn bị điện giật, lập tức lao vào dùng tay kéo bạn ra -> *Hậu quả nguy hiểm*: Dòng điện truyền qua người bạn sang cơ thể mình, khiến cả hai cùng bị giật.\n\n### 5. CÂU CHUYỆN BỐI CẢNH (NARRATIVE/STORY ARC)\n* **Tên câu chuyện**: Sứ mệnh giải cứu đảo Sét Lan\n* **Bối cảnh**: Đảo An Toàn (Safety Island) - Thung lũng Sét Lan\n* **Nhân vật**: Nhà thám hiểm (Học sinh), Nova (Sao nhỏ đồng hành), Sparky (Linh tinh nghịch ngợm hay nghịch dây điện).\n* **Tóm tắt cốt truyện**:\n  - Thung lũng Sét Lan bỗng dưng mất điện. Nova và Nhà thám hiểm phát hiện Sparky đang dùng tay ướt nhẹp nghịch ngợm tủ điện trung tâm và chuẩn bị cắm một sợi dây bị hở đồng vào ổ cắm để nghịch tia lửa.\n  - Nova lập tức ngăn lại và giải thích cho Sparky hiểu về sự nguy hiểm của nước dẫn điện và dây điện hở.\n  - Sparky hối hận nhưng tủ điện bị chập và hóa thành Quái vật Điện Giật Volt-O hung dữ. Học sinh phải giúp Sparky đánh bại Volt-O bằng kiến thức an toàn điện.\n\n### 6. CƠ CHẾ MINI-GAME PHÙ HỢP (MINI-GAME MECHANICS)\n* **Mini-game 1: Máy Dò Tìm Dây Hở (Hidden Hazards)**\n  - *Gameplay*: Tìm điểm nguy hiểm (Hidden Object).\n  - *Mô tả tương tác*: Màn hình hiển thị một căn phòng khách lộn xộn. Trẻ phải dùng ngón tay chạm vào các điểm mất an toàn điện trong vòng 60 giây (ví dụ: dây sạc bị mèo cắn hở đồng, ổ điện quá thấp cạnh vũng nước lau nhà, phích cắm cắm lỏng lẻo bốc khói). Mỗi lần chạm đúng, AI Companion sẽ giải thích tại sao đó là điểm nguy hiểm.\n* **Mini-game 2: Đội Cứu Hộ Lau Tay (Dry Hands Matcher)**\n  - *Gameplay*: Kéo thả phân loại (Drag and Drop).\n  - *Mô tả tương tác*: Màn hình chia làm hai bên: Bên ẩm ướt (chơi bóng nước, rửa tay, đi mưa) và Bên khô ráo. Trẻ phải kéo các bàn tay tương ứng qua khăn lau khô trước khi kéo bàn tay đó chạm vào phích cắm điện để mở khóa cửa.\n\n### 7. KỊCH BẢN ĐẤU BOSS (BOSS BATTLE SCENARIO)\n* **Tên Boss**: Quái vật Điện Giật Volt-O\n* **Bối cảnh Boss Battle**: Tủ điện trung tâm bốc khói và xẹt lửa xanh lục.\n* **Cơ chế đối đầu**:\n  - *Volt-O ra chiêu 1*: Volt-O phóng ra một vũng nước lớn lan đến chân Sparky và đe dọa: \"Ta sẽ ném sợi dây điện hở này vào vũng nước!\"\n    -> *Học sinh phản công*: Chọn phương án đúng trong 3 giây: (A) Lao vào ôm Sparky kéo ra, (B) Hét lớn bảo Sparky nhảy lên ghế gỗ khô ráo, (C) Dùng vòi nước xịt vào Volt-O. (Đáp án đúng: B).\n  - *Volt-O ra chiêu 2*: Volt-O biến ra một bàn tay ướt và với tới công tắc nguồn điện để bật máy.\n    -> *Học sinh phản công*: Chọn công cụ ngăn chặn: (A) Chiếc chổi tre khô, (B) Cột sắt, (C) Thanh nhựa ẩm. (Đáp án đúng: A - dùng vật cách điện khô ráo để gạt).\n  - *Chiêu thức quyết định*: Volt-O suy yếu, học sinh phải trả lời câu hỏi phản tư: \"Nếu em phát hiện ổ điện trong nhà tắm bị bắn nước vào, em sẽ làm gì đầu tiên?\" để dập tắt hoàn toàn Volt-O.\n\n### 8. NHIỆM VỤ NGOÀI ĐỜI THỰC (REAL-LIFE MISSIONS)\n* **Nhiệm vụ 1: Biệt đội Dán Nhãn Cảnh Báo (Dành cho mọi khối lớp)**\n  - *Mô tả chi tiết*: Con hãy cùng bố/mẹ đi một vòng quanh nhà. Tìm các ổ cắm điện nằm ở tầm thấp (dưới 1 mét) hoặc các thiết bị điện lớn (tủ lạnh, máy giặt, lò vi sóng). Vẽ 3 hình mặt cười cảnh báo màu vàng trên giấy, nhờ bố mẹ cắt ra và dán nhẹ bên cạnh các khu vực đó để nhắc nhở cả nhà luôn cẩn thận.\n  - *Lệnh an toàn bắt buộc*: `Em phải đi cùng bố mẹ và tuyệt đối không tự ý chạm tay vào bên trong ổ điện.`\n\n### 9. YÊU CẦU BẰNG CHỨNG NĂNG LỰC (COMPETENCY EVIDENCE REQUIREMENTS)\n* **Bằng chứng bắt buộc**: Ảnh chụp (Photo Evidence).\n  - *Mô tả bằng chứng đạt chuẩn*: Ảnh chụp rõ ràng 1 nhãn cảnh báo do trẻ tự vẽ đã được dán bên cạnh ổ cắm điện hoặc thiết bị điện trong nhà. Trong ảnh có thể có bàn tay trẻ chỉ vào nhãn (khuyến khích không chụp mặt trẻ để bảo vệ quyền riêng tư).\n* **Phỏng vấn Phản tư của AI (Tier E - Voice Evidence)**:\n  - *Câu hỏi AI*: \"Chào cậu! Cậu đã dán nhãn cảnh báo điện rất đẹp. Bây giờ, cậu hãy ghé sát tai tớ (nhấn micro) và kể cho tớ nghe: Tại sao chúng mình tuyệt đối không được dùng tay đang ướt để cắm điện thế nhỉ?\"\n  - *Tiêu chuẩn AI duyệt*: File ghi âm có chứa các từ khóa cốt lõi: \"nước dẫn điện\", \"bị giật nguy hiểm\", \"ướt\", \"khô tay\".\n\n### 10. TIÊU CHÍ MASTERY CHUYÊN BIỆT (MASTERY VALIDATION CRITERIA)\nĐể đạt Mastery kỹ năng Phòng tránh nguy cơ bị điện giật, học sinh phải:\n1. Trả lời đúng ít nhất **16/20** câu hỏi thuộc bộ câu hỏi An toàn điện.\n2. Vượt qua trận đấu Boss Volt-O trong game.\n3. Hoàn thành ghi âm phản tư và được AI Companion duyệt (đạt độ tin cậy từ khóa > 85%).\n4. Phụ huynh nhấn nút \"Xác nhận đạt\" cho Nhiệm vụ Dán Nhãn Cảnh Báo trên app phụ huynh.\n```\n",
            database_schema: "# 📁 KIẾN TRÚC DỮ LIỆU & LƯỢC ĐỒ CƠ SỞ DỮ LIỆU (DATABASE SCHEMA)\n## THIẾT KẾ CƠ SỞ DỮ LIỆU TĨNH VÀ ĐỘNG CHO HỆ THỐNG NOVASTARS\n\n---\n\n## I. TRIẾT LÝ THIẾT KẾ CƠ SỞ DỮ LIỆU (DATABASE DESIGN DECISIONS)\n\n### Purpose\nXác lập cấu trúc lưu trữ dữ liệu tối ưu cho cả phần nội dung giáo dục tĩnh (Static Content Metadata) và tiến trình học tập động của học sinh (Dynamic Student Progress & Telemetry), đảm bảo tính nhất quán dữ liệu, tốc độ truy vấn nhanh và khả năng mở rộng quy mô.\n\n### Design Rationale\nChúng tôi sử dụng mô hình cơ sở dữ liệu phi quan hệ (NoSQL) **Cloud Firestore** kết hợp với phân phối tĩnh qua **CDN** cho các file dữ liệu tĩnh lớn. Dữ liệu tĩnh như danh mục kỹ năng, câu hỏi trắc nghiệm sẽ được đóng gói thành các file JSON tĩnh và tải cục bộ (Local Storage/Cache) trên thiết bị của học sinh để giảm thiểu chi phí đọc ghi database và độ trễ khi chơi game. Trong khi đó, dữ liệu động liên quan đến tài khoản người dùng, tiến trình học tập, bằng chứng hình ảnh/video và nhật ký phê duyệt của phụ huynh sẽ được lưu trữ thời gian thực trên Firestore để đồng bộ hóa ngay lập tức giữa ứng dụng của Học sinh và Dashboard của Phụ huynh.\n\n```mermaid\nerDiagram\n    DOMAINS ||--o{ CLUSTERS : contains\n    CLUSTERS ||--o{ SKILLS : contains\n    SKILLS ||--o{ MICRO_SKILLS : contains\n    MICRO_SKILLS ||--o{ LEARNING_OBJECTIVES : contains\n    LEARNING_OBJECTIVES ||--o{ ACTIVITIES : contains\n    SKILLS ||--o{ ASSESSMENTS : contains\n    SKILLS ||--o{ REWARDS : contains\n\n    USERS ||--o{ STUDENT_PROGRESS : tracks\n    SKILLS ||--o{ STUDENT_PROGRESS : \"is tracked in\"\n    USERS ||--o{ EVIDENCE_SUBMISSIONS : uploads\n    SKILLS ||--o{ EVIDENCE_SUBMISSIONS : \"references\"\n    USERS ||--o{ MISSION_INSTANCES : executes\n    SKILLS ||--o{ MISSION_INSTANCES : \"references\"\n    USERS ||--o{ USER_REWARDS : earns\n    REWARDS ||--o{ USER_REWARDS : \"is earned in\"\n```\n\n### Educational Basis\n* **Mastery-Based Data Modeling**: Dữ liệu phải lưu trữ ở mức độ hạt nhân (Granular level). Thay vì chỉ lưu trạng thái \"Đạt kỹ năng điện giật\", hệ thống phải lưu chính xác trẻ đã đạt những Micro-skills nào, làm sai câu hỏi nào nhiều nhất để AI có cơ sở dữ liệu phân tích lỗ hổng kiến thức chính xác.\n\n### Trade-offs\n* **Sự đánh đổi**: Cấu trúc dữ liệu phi quan hệ (NoSQL) sẽ dẫn đến việc lặp lại dữ liệu (Denormalization) ở một số bảng để tối ưu hóa tốc độ đọc. Ví dụ: trường `skillName` sẽ được lưu trực tiếp ở document `student_progress` thay vì chỉ lưu `skillId` rồi join bảng như SQL truyền thống.\n* **Quyết định**: Chấp nhận tốn thêm dung lượng lưu trữ nhỏ để đạt tốc độ truy vấn cực nhanh thời gian thực và giảm thiểu chi phí gọi API.\n\n### Advantages\n* Tốc độ phản hồi ứng dụng mượt mà, không bị giật lag khi chuyển cảnh game.\n* Tiết kiệm tới **60%** chi phí truy vấn database Firestore nhờ đẩy toàn bộ câu hỏi tĩnh sang CDN tĩnh.\n* Đồng bộ hóa thời gian thực (Real-time listener) cực tốt giữa ứng dụng học sinh và phụ huynh.\n\n### Risks\n* Nguy cơ không đồng bộ dữ liệu (Data inconsistency) khi cập nhật tên của một Skill lớn ở bảng tĩnh nhưng các document cũ ở bảng động vẫn lưu tên cũ.\n* *Biện pháp giảm thiểu*: Viết các Script Migration tự động cập nhật các trường trùng lặp trên database động khi có sự thay đổi ở CMS tĩnh.\n\n### Dependencies\n* Firebase SDK (Firestore, Storage, Auth) hoạt động ổn định trên client.\n\n### Future Impact\nLược đồ dữ liệu này cho phép dễ dàng tích hợp các hệ thống phân tích dữ liệu lớn (như BigQuery) để thực hiện các nghiên cứu giáo dục quy mô lớn trong tương lai.\n\n---\n\n## II. CHI TIẾT CÁC COLLECTION TĨNH (STATIC DATA SCHEMA)\n\nCác collection này lưu trữ nội dung chương trình học, do đội ngũ Content Production cập nhật qua CMS và được phân phối tĩnh tới Client.\n\n### 1. Collection `domains` (Lĩnh vực năng lực)\nLưu trữ thông tin các Lĩnh vực lớn trong đời sống.\n\n* **Schema**:\n  - `domainId` (string, PK): Mã định danh (ví dụ: `self-care-safety`).\n  - `name` (string): Tên tiếng Việt (ví dụ: `Tự chăm sóc & An toàn`).\n  - `description` (string): Mô tả tổng quan.\n  - `order` (number): Thứ tự hiển thị trên bản đồ thế giới.\n  - `iconUrl` (string): Đường dẫn ảnh đại diện lĩnh vực.\n\n### 2. Collection `clusters` (Nhóm năng lực)\nPhân nhóm các kỹ năng trong cùng một lĩnh vực.\n\n* **Schema**:\n  - `clusterId` (string, PK): Mã định danh (ví dụ: `physical-safety`).\n  - `domainId` (string, FK): Liên kết tới `domains`.\n  - `name` (string): Tên nhóm (ví dụ: `An toàn thể chất`).\n  - `description` (string): Mô tả nhóm.\n  - `order` (number): Thứ tự hiển thị.\n\n### 3. Collection `skills` (Kỹ năng cốt lõi)\nĐịnh nghĩa thông tin cơ bản của từng kỹ năng.\n\n* **Schema**:\n  - `skillId` (string, PK): Mã định danh (ví dụ: `electrical-safety`).\n  - `clusterId` (string, FK): Liên kết tới `clusters`.\n  - `domainId` (string, FK): Liên kết tới `domains`.\n  - `name` (string): Tên kỹ năng (ví dụ: `Phòng tránh nguy cơ bị điện giật`).\n  - `description` (string): Mô tả ngắn gọn.\n  - `iconUrl` (string): Ảnh huy hiệu kỹ năng.\n  - `gradeBracket` (array of numbers): Các khối lớp áp dụng (ví dụ: `[1, 2, 3, 4, 5]`).\n  - `order` (number): Thứ tự học trên đảo kỹ năng.\n\n### 4. Collection `micro_skills` (Kỹ năng vi mô)\nPhân rã chi tiết của kỹ năng cốt lõi.\n\n* **Schema**:\n  - `microSkillId` (string, PK): Mã định danh (ví dụ: `dry-hands-rule`).\n  - `skillId` (string, FK): Liên kết tới `skills`.\n  - `name` (string): Tên kỹ năng vi mô (ví dụ: `Quy tắc lau tay khô trước khi cắm điện`).\n  - `description` (string): Mô tả thao tác thực tế.\n\n### 5. Collection `learning_objectives` (Mục tiêu học tập)\nChi tiết hóa kết quả kỳ vọng cho từng kỹ năng vi mô.\n\n* **Schema**:\n  - `objectiveId` (string, PK): Mã định danh (ví dụ: `understand-water-conductivity`).\n  - `microSkillId` (string, FK): Liên kết tới `micro_skills`.\n  - `description` (string): Phát biểu mục tiêu (ví dụ: `Học sinh giải thích được tại sao nước dẫn điện`).\n\n### 6. Collection `activities`
