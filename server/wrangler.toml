name = "novastars-api"
account_id = "8c73f3c6b0fc1f5614bc222fcb72371f"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare R2 Object Storage Binding
[[r2_buckets]]
binding = "CONTENT_BUCKET"
bucket_name = "novastars-content-production"
preview_bucket_name = "novastars-content-preview"

# Environment Variables (Secrets will be set via wrangler secret put)
[vars]
ENVIRONMENT = "production"
API_VERSION = "v1"
